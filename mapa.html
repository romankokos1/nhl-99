<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a130b">
<title>Mapa · Pivní deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#191009; --surface:#251a0f; --surface-2:#2c2013;
    --glass:rgba(44,32,19,0.72); --hairline:rgba(232,163,61,0.14); --hairline-strong:rgba(232,163,61,0.24);
    --amber:#e8a33d; --amber-bright:#ffc35a; --foam:#f7edd6;
    --text:#f2e7d2; --text-2:#c3ab86; --text-3:#8f795a; --text-4:#6b593f;
  }
  html[data-theme="light"]{
    --bg:#faf5ea; --surface:#ffffff; --surface-2:#f6efe0;
    --glass:rgba(255,255,255,0.78); --hairline:rgba(90,60,20,0.12); --hairline-strong:rgba(90,60,20,0.22);
    --amber:#b8791f; --amber-bright:#a8660f; --foam:#2b2011;
    --text:#2e2213; --text-2:#5c4a34; --text-3:#7d6a4e; --text-4:#a4906f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column;
  }
  ::selection{background:var(--amber); color:#191009;}

  .state-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; gap:16px;
    background:radial-gradient(ellipse at 50% 30%, var(--surface) 0%, var(--bg) 70%);
  }
  .state-glass{opacity:0.85; animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .state-title{font-family:'EB Garamond',serif; font-weight:600; font-size:24px; color:var(--foam);}
  .state-sub{font-size:14.5px; color:var(--text-2); max-width:340px; line-height:1.5;}
  .state-btn{
    margin-top:8px; font-family:inherit; font-size:14px; font-weight:700; color:#241703;
    background:linear-gradient(160deg, var(--amber-bright), var(--amber)); border:none; padding:13px 24px; border-radius:999px; cursor:pointer;
  }

  header{
    flex-shrink:0; display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px; border-bottom:1px solid var(--hairline);
    background:var(--surface);
  }
  .h-title{font-family:'EB Garamond',serif; font-weight:600; font-size:20px; color:var(--foam); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .icon-btn{
    width:34px; height:34px; border-radius:50%; background:var(--surface-2); border:1px solid var(--hairline);
    color:var(--text-2); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn svg{width:16px; height:16px;}
  .top-link{
    font-size:12.5px; font-weight:700; color:var(--text-2); text-decoration:none; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--hairline); padding:8px 13px; border-radius:999px;
    display:inline-flex; align-items:center; gap:5px;
  }
  .top-link svg{width:13px; height:13px;}
  .mode-seg{display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:999px; padding:3px; flex-shrink:0;}
  .mode-seg button{font-family:inherit; font-size:12.5px; font-weight:700; color:var(--text-3); background:none; border:none; padding:7px 13px; border-radius:999px; cursor:pointer;}
  .mode-seg button.active{background:var(--amber); color:#241703;}

  .body{flex:1; display:flex; min-height:0;}
  #map{flex:1; min-width:0;}
  .sidebar{
    width:300px; flex-shrink:0; border-left:1px solid var(--hairline); background:var(--surface);
    display:flex; flex-direction:column; min-height:0;
  }
  .sidebar-head{padding:14px 16px 10px; flex-shrink:0; display:flex; flex-direction:column; gap:10px;}
  .sidebar-count{font-size:12.5px; color:var(--text-3); font-weight:600;}
  .color-seg{display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--hairline); border-radius:999px; padding:3px;}
  .color-seg button{flex:1; font-family:inherit; font-size:11.5px; font-weight:700; color:var(--text-3); background:none; border:none; padding:6px 8px; border-radius:999px; cursor:pointer;}
  .color-seg button.active{background:var(--amber); color:#241703;}
  .trip-select{
    width:100%; font-family:inherit; font-size:12.5px; font-weight:600; color:var(--text-2);
    background:var(--surface-2); border:1px solid var(--hairline); border-radius:10px; padding:8px 10px; cursor:pointer;
  }
  .legend{display:flex; flex-wrap:wrap; gap:10px; padding:0 16px 12px; font-size:11px; font-weight:600; color:var(--text-3); flex-shrink:0;}
  .legend span{display:flex; align-items:center; gap:5px;}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block; box-shadow:0 0 0 1px rgba(0,0,0,0.25);}
  .place-list{flex:1; overflow-y:auto; padding:0 10px 16px;}
  .place-row{
    display:flex; align-items:center; gap:10px; padding:10px 8px; border-radius:12px; cursor:pointer; border:1px solid transparent;
  }
  .place-row:hover, .place-row.active{background:var(--surface-2); border-color:var(--hairline);}
  .place-dot{width:26px; height:26px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#241703;}
  .place-info{min-width:0; flex:1;}
  .place-name{font-size:13.5px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .place-sub{font-size:11.5px; color:var(--text-3); margin-top:1px;}
  .place-list-empty{padding:30px 16px; text-align:center; font-size:13px; color:var(--text-3);}

  /* mobile: sidebar becomes a bottom sheet you can scroll, map keeps most of the height */
  @media(max-width:760px){
    .body{flex-direction:column;}
    #map{flex:1 1 55%;}
    .sidebar{width:100%; flex:1 1 45%; border-left:none; border-top:1px solid var(--hairline);}
  }

  .leaflet-popup-content-wrapper{background:var(--surface); color:var(--text); border-radius:12px;}
  .leaflet-popup-tip{background:var(--surface);}
  .map-pin-popup{font-family:'Inter',sans-serif; min-width:140px;}
  .map-pin-popup b{display:block; font-size:13.5px; margin-bottom:2px;}
  .map-pin-popup span{font-size:12px; color:var(--text-3);}
  .visit-pin{background:none; border:none;}
  .visit-pin-inner{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#241703; font-weight:800; font-size:12px; border:2px solid rgba(255,255,255,0.85); box-shadow:0 2px 6px rgba(0,0,0,0.4);
  }
  .route-pin-inner{
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#f7edd6; font-weight:800; font-size:12px; background:#5c4a34; border:2px solid var(--amber-bright); box-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>

  <div id="state" class="state-screen">
    <svg class="state-glass" width="52" height="60" viewBox="0 0 26 30"><path d="M4 3h18l-2 22a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3L4 3z" fill="none" stroke="var(--amber)" stroke-width="1.4"/></svg>
    <div class="state-title" id="state-title">Kreslím mapu…</div>
    <div class="state-sub" id="state-sub">Chvilku strpení, tahám polohy z deníku.</div>
    <button class="state-btn" id="state-btn" style="display:none">Zkusit znovu</button>
  </div>

  <div id="page" style="display:none; height:100%; display:flex; flex-direction:column;">
    <header>
      <a class="top-link" id="top-link" href="pivni-denik.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Deník
      </a>
      <div class="h-title">Mapa</div>
      <div class="mode-seg" id="mode-seg">
        <button data-mode="venues" class="active">Podniky</button>
        <button data-mode="breweries">Pivovary</button>
      </div>
      <button class="icon-btn" id="fit-btn" aria-label="Přizpůsobit místům" title="Přizpůsobit místům">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button class="icon-btn" id="theme-toggle" aria-label="Přepnout motiv">
        <svg id="theme-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>
    <div class="body">
      <div id="map"></div>
      <div class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-count" id="sidebar-count">— míst</div>
          <div class="color-seg" id="color-seg">
            <button data-color="count" class="active">Podle počtu</button>
            <button data-color="rating">Podle hodnocení</button>
          </div>
          <select class="trip-select" id="trip-select">
            <option value="">Všechna místa</option>
          </select>
        </div>
        <div class="legend" id="legend-count">
          <span><i style="background:#8f795a"></i>1×</span>
          <span><i style="background:#c07d24"></i>2–4×</span>
          <span><i style="background:#e8a33d"></i>5–9×</span>
          <span><i style="background:#ffc35a"></i>10×+</span>
        </div>
        <div class="legend" id="legend-rating" style="display:none">
          <span><i style="background:#b23a3a"></i>nízké</span>
          <span><i style="background:#c07d24"></i>střední</span>
          <span><i style="background:#ffc35a"></i>vysoké</span>
        </div>
        <div class="place-list" id="place-list"></div>
      </div>
    </div>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/pivovar\s+/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }

  const THEME_KEY='pivni-denik-mapa-theme';
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    const mc=document.querySelector('meta[name="theme-color"]');
    if(mc) mc.setAttribute('content', t==='light' ? '#faf5ea' : '#1a130b');
    const icon=$('#theme-toggle-icon');
    if(icon) icon.innerHTML = t==='light'
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke-linecap="round"/>'
      : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
  }
  let theme='dark';
  try{ theme=localStorage.getItem(THEME_KEY)||'dark'; }catch(e){}
  applyTheme(theme);
  $('#theme-toggle').addEventListener('click', ()=>{
    theme = theme==='light' ? 'dark' : 'light';
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    applyTheme(theme);
  });

  const CFG_KEY='pivni-denik-cfg-v1';
  let cfg={url:'',key:''};
  try{ cfg=Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY))||{}); }catch(e){}
  function parseInvite(){
    const h=location.hash||'';
    const m=h.match(/join=([^&]+)/);
    if(!m) return null;
    try{
      const json=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));
      const o=JSON.parse(json);
      if(o.url && o.key) return o;
    }catch(e){}
    return null;
  }
  const invite=parseInvite();
  if(invite){ cfg.url=invite.url; cfg.key=invite.key; history.replaceState(null,'',location.href.split('#')[0]); }

  function showState(title, sub, showRetry){
    $('#state-title').textContent=title;
    $('#state-sub').textContent=sub;
    $('#state-btn').style.display = showRetry ? 'inline-flex' : 'none';
  }
  $('#state-btn').addEventListener('click', ()=>location.reload());

  function backHref(){
    try{
      if(document.referrer){
        const r=new URL(document.referrer);
        if(r.origin===location.origin && !/mapa|vitrina/i.test(r.pathname)) return r.pathname+r.search;
      }
    }catch(e){}
    return 'pivni-denik.html';
  }

  if(!cfg.url || !cfg.key){
    showState('Mapa je zatím prázdná', 'Otevři tuhle stránku ze zvacího odkazu appky, nebo z prohlížeče, kde už máš pivní deník připojený k partě.', false);
    return;
  }

  const base=cfg.url.replace(/\/$/,'');
  const headers={ apikey:cfg.key, Authorization:'Bearer '+cfg.key };

  function visitBucket(count){
    if(count>=10) return '#ffc35a';
    if(count>=5) return '#e8a33d';
    if(count>=2) return '#c07d24';
    return '#8f795a';
  }
  function beerWord(n){ return n===1?'pivo':(n<5?'piva':'piv'); }

  const CZ_BOUNDS=[[48.5,12.0],[51.1,18.9]];
  let piva=[], pivovary=[], mista=[], vylety=[];
  let lastBounds=[];
  let mapInstance=null, markersLayer=null, routeLayer=null;
  let mode='venues', colorMode='count', activeTripId='';

  async function boot(){
    try{
      const r=await fetch(base+'/rest/v1/piva?select=pivovar,spolupivovar,kde,hodnoceni,osoba,vylet_id,datum,nazev', { headers });
      if(!r.ok) throw new Error('HTTP '+r.status);
      piva=await r.json();
    }catch(e){
      showState('Nejde se připojit', 'Zkontroluj připojení k internetu, nebo jestli je zvací odkaz ještě platný.', true);
      return;
    }
    try{
      const r2=await fetch(base+'/rest/v1/pivovary?select=klic,nazev,lat,lng,mesto,kocovny', { headers });
      if(r2.ok) pivovary=await r2.json();
    }catch(e){}
    try{
      const r3=await fetch(base+'/rest/v1/mista?select=*', { headers });
      if(r3.ok) mista=await r3.json();
    }catch(e){}
    try{
      const r4=await fetch(base+'/rest/v1/vylety?select=id,nazev,datum_od,datum_do&order=datum_od.desc', { headers });
      if(r4.ok) vylety=await r4.json();
    }catch(e){}

    $('#state').style.display='none';
    $('#page').style.display='flex';
    $('#top-link').href=backHref();
    populateTripSelect();
    await initMap();
    renderMode();
  }

  function populateTripSelect(){
    const sel=$('#trip-select'); if(!sel) return;
    const withStops=vylety.filter(t=>piva.some(b=>b.vylet_id===t.id && b.kde));
    sel.innerHTML='<option value="">Všechna místa</option>'+withStops.map(t=>{
      const label=t.datum_od ? t.nazev+' ('+t.datum_od.slice(0,4)+')' : t.nazev;
      return '<option value="'+esc(t.id)+'">'+esc(label)+'</option>';
    }).join('');
  }

  function loadLeaflet(){
    return new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      s.onload=resolve; s.onerror=reject;
      document.head.appendChild(s);
    });
  }
  async function initMap(){
    await loadLeaflet();
    mapInstance=L.map('map', { zoomControl:true }).fitBounds(CZ_BOUNDS);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19 }).addTo(mapInstance);
    markersLayer=L.layerGroup().addTo(mapInstance);
    routeLayer=L.layerGroup().addTo(mapInstance);
  }
  function colorForRating(avg){
    if(!avg) return '#6b593f';
    const stops=[[0,[178,58,58]],[5,[192,125,36]],[10,[255,195,90]]];
    let lo=stops[0], hi=stops[stops.length-1];
    for(let i=0;i<stops.length-1;i++){ if(avg>=stops[i][0] && avg<=stops[i+1][0]){ lo=stops[i]; hi=stops[i+1]; break; } }
    const t=(avg-lo[0])/((hi[0]-lo[0])||1);
    const rgb=lo[1].map((c,i)=>Math.round(c+(hi[1][i]-c)*t));
    return 'rgb('+rgb.join(',')+')';
  }
  function pinColor(it){ return colorMode==='rating' ? colorForRating(it.avg) : visitBucket(it.count); }
  function pinLabel(it){ return colorMode==='rating' ? (it.avg? it.avg.toFixed(1) : '–') : String(it.count); }

  function distinctPlaces(){
    const map=new Map();
    piva.forEach(b=>{
      const raw=(b.kde||'').trim(); if(!raw) return;
      const key=norm(raw);
      if(!map.has(key)) map.set(key,{key,label:raw,count:0,sum:0,rated:0});
      const e=map.get(key); e.count++;
      if(b.hodnoceni>0){ e.sum+=b.hodnoceni; e.rated++; }
    });
    return [...map.values()].map(e=>({...e, avg: e.rated? e.sum/e.rated : 0}));
  }
  function distinctBreweries(){
    const map=new Map();
    piva.forEach(b=>{
      [b.pivovar, b.spolupivovar].filter(Boolean).forEach(raw=>{
        const key=norm(raw);
        const known=pivovary.find(p=>p.klic===key);
        if(!map.has(key)) map.set(key,{key,label:(known&&known.nazev)||raw,count:0,sum:0,rated:0,kocovny:known&&known.kocovny});
        const e=map.get(key); e.count++;
        if(b.hodnoceni>0){ e.sum+=b.hodnoceni; e.rated++; }
      });
    });
    return [...map.values()].map(e=>({...e, avg: e.rated? e.sum/e.rated : 0}));
  }

  function renderMode(){
    routeLayer.clearLayers();
    markersLayer.clearLayers();
    const isBrew = mode==='breweries';
    const items = isBrew ? distinctBreweries() : distinctPlaces();
    const coordFor = key => isBrew
      ? (()=>{ const p=pivovary.find(x=>x.klic===key); return (p && p.lat!=null) ? {lat:p.lat,lng:p.lng} : null; })()
      : (()=>{ const p=mista.find(x=>x.klic===key); return (p && p.lat!=null) ? {lat:p.lat,lng:p.lng} : null; })();

    const withCoord=[], withoutCoord=[];
    items.forEach(it=>{
      if(isBrew && it.kocovny) return; // no fixed home by design — nothing to plot
      const c=coordFor(it.key);
      if(c){ it.coord=c; withCoord.push(it); } else withoutCoord.push(it);
    });
    withCoord.sort((a,b)=>b.count-a.count);

    $('#sidebar-count').textContent = withCoord.length+' '+(isBrew?'pivovarů na mapě':'podniků na mapě')+(withoutCoord.length?' · '+withoutCoord.length+' bez polohy':'');

    const bounds=[];
    const markerByKey={};
    withCoord.forEach(it=>{
      const color=pinColor(it);
      const icon=L.divIcon({ className:'visit-pin', html:'<div class="visit-pin-inner" style="background:'+color+'">'+pinLabel(it)+'</div>', iconSize:[28,28], iconAnchor:[14,14], popupAnchor:[0,-14] });
      const m=L.marker([it.coord.lat,it.coord.lng], { icon }).addTo(markersLayer);
      m.bindPopup('<div class="map-pin-popup"><b>'+esc(it.label)+'</b><span>'+it.count+' '+beerWord(it.count)+(it.avg?' · Ø '+it.avg.toFixed(1):'')+'</span></div>');
      markerByKey[it.key]=m;
      bounds.push([it.coord.lat,it.coord.lng]);
    });
    // start fixed on the whole country, not auto-zoomed to whatever markers exist —
    // gives the map a consistent, recognizable "home" view every time
    lastBounds=bounds;

    const list=$('#place-list');
    if(!withCoord.length){
      list.innerHTML='<div class="place-list-empty">Zatím žádná poloha k zobrazení. Otevři appku a v Mapě je najdi, ať je appka umí zakreslit.</div>';
    } else {
      list.innerHTML=withCoord.map(it=>
        '<div class="place-row" data-key="'+esc(it.key)+'">'
        +'<span class="place-dot" style="background:'+pinColor(it)+'">'+pinLabel(it)+'</span>'
        +'<span class="place-info"><div class="place-name">'+esc(it.label)+'</div><div class="place-sub">'+it.count+' '+beerWord(it.count)+(it.avg?' · Ø '+it.avg.toFixed(1):'')+'</div></span>'
        +'</div>'
      ).join('');
      list.querySelectorAll('.place-row').forEach(row=>{
        row.addEventListener('click', ()=>{
          list.querySelectorAll('.place-row').forEach(r=>r.classList.remove('active'));
          row.classList.add('active');
          const m=markerByKey[row.dataset.key];
          if(m){ mapInstance.setView(m.getLatLng(), Math.max(mapInstance.getZoom(),13), { animate:true }); m.openPopup(); }
        });
      });
    }
  }

  function renderTripRoute(tripId){
    markersLayer.clearLayers();
    routeLayer.clearLayers();
    const trip=vylety.find(t=>t.id===tripId); if(!trip) return;
    const stops=piva.filter(b=>b.vylet_id===tripId && b.kde)
      .sort((a,b)=>(a.datum||'').localeCompare(b.datum||''));
    // one stop per distinct venue, kept in the order it was first visited that trip
    const seen=new Set(); const ordered=[];
    stops.forEach(b=>{
      const key=norm(b.kde);
      if(seen.has(key)) return; seen.add(key);
      const p=mista.find(x=>x.klic===key);
      if(p && p.lat!=null) ordered.push({ key, label:b.kde, coord:{lat:p.lat,lng:p.lng} });
    });

    $('#sidebar-count').textContent = ordered.length+' zastávek na výletu „'+trip.nazev+'"'+(ordered.length<stops.length?' (zbytek bez polohy)':'');

    const bounds=[];
    ordered.forEach((s,i)=>{
      const icon=L.divIcon({ className:'visit-pin', html:'<div class="route-pin-inner">'+(i+1)+'</div>', iconSize:[26,26], iconAnchor:[13,13], popupAnchor:[0,-13] });
      L.marker([s.coord.lat,s.coord.lng], { icon }).addTo(routeLayer).bindPopup('<div class="map-pin-popup"><b>'+esc(s.label)+'</b><span>zastávka '+(i+1)+'</span></div>');
      bounds.push([s.coord.lat,s.coord.lng]);
    });
    if(ordered.length>1){
      L.polyline(bounds, { color:'#ffc35a', weight:3, opacity:0.8, dashArray:'2 8', lineCap:'round' }).addTo(routeLayer);
    }
    lastBounds=bounds;
    if(bounds.length) mapInstance.fitBounds(bounds, { padding:[50,50], maxZoom:15 });

    const list=$('#place-list');
    list.innerHTML = ordered.length
      ? ordered.map((s,i)=>
          '<div class="place-row" data-idx="'+i+'">'
          +'<span class="place-dot" style="background:#5c4a34; border:2px solid var(--amber-bright)">'+(i+1)+'</span>'
          +'<span class="place-info"><div class="place-name">'+esc(s.label)+'</div><div class="place-sub">zastávka '+(i+1)+' z '+ordered.length+'</div></span>'
          +'</div>'
        ).join('')
      : '<div class="place-list-empty">Žádná ze zastávek tohohle výletu ještě nemá polohu.</div>';
    list.querySelectorAll('.place-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const s=ordered[+row.dataset.idx];
        if(s) mapInstance.setView([s.coord.lat,s.coord.lng], Math.max(mapInstance.getZoom(),14), { animate:true });
      });
    });
  }

  $('#trip-select').addEventListener('change', e=>{
    activeTripId=e.target.value;
    const showingRoute=!!activeTripId;
    $('#mode-seg').style.opacity = showingRoute ? '0.4' : '1';
    $('#mode-seg').style.pointerEvents = showingRoute ? 'none' : 'auto';
    $('#color-seg').style.display = showingRoute ? 'none' : 'flex';
    $('#legend-count').style.display = (!showingRoute && colorMode==='count') ? 'flex' : 'none';
    $('#legend-rating').style.display = (!showingRoute && colorMode==='rating') ? 'flex' : 'none';
    if(showingRoute) renderTripRoute(activeTripId); else renderMode();
  });

  $('#mode-seg').addEventListener('click', e=>{
    const btn=e.target.closest('[data-mode]'); if(!btn) return;
    mode=btn.dataset.mode;
    document.querySelectorAll('#mode-seg button').forEach(b=>b.classList.toggle('active', b===btn));
    renderMode();
  });
  $('#color-seg').addEventListener('click', e=>{
    const btn=e.target.closest('[data-color]'); if(!btn) return;
    colorMode=btn.dataset.color;
    document.querySelectorAll('#color-seg button').forEach(b=>b.classList.toggle('active', b===btn));
    $('#legend-count').style.display = colorMode==='count' ? 'flex' : 'none';
    $('#legend-rating').style.display = colorMode==='rating' ? 'flex' : 'none';
    renderMode();
  });
  $('#fit-btn').addEventListener('click', ()=>{
    if(lastBounds.length) mapInstance.fitBounds(lastBounds, { padding:[30,30], maxZoom:14 });
  });

  boot();
})();
</script>
</body>
</html>
