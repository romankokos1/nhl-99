<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a130b">
<title>Vitrína · Pivní deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
  :root{
    /* same palette as the main app — dark brown, warm amber */
    --bg:#191009;
    --surface:#251a0f;
    --glass:rgba(44,32,19,0.72);
    --hairline:rgba(232,163,61,0.14);
    --hairline-strong:rgba(232,163,61,0.24);
    --amber:#e8a33d;
    --amber-bright:#ffc35a;
    --foam:#f7edd6;
    --text:#f2e7d2;
    --text-2:#c3ab86;
    --text-3:#8f795a;
    --text-4:#6b593f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber); color:#191009;}
  img{display:block; max-width:100%;}

  /* ---------- centered states (loading / error / empty) ---------- */
  .state-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; gap:16px;
    background:radial-gradient(ellipse at 50% 30%, #241708 0%, var(--bg) 70%);
  }
  .state-glass{opacity:0.85; animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .state-title{font-family:'Fraunces',serif; font-weight:600; font-size:24px; color:var(--foam);}
  .state-sub{font-size:14.5px; color:var(--text-2); max-width:340px; line-height:1.5;}
  .state-btn{
    margin-top:8px; font-family:inherit; font-size:14px; font-weight:700; color:#241703;
    background:linear-gradient(160deg, var(--amber-bright), var(--amber));
    border:none; padding:13px 24px; border-radius:999px; cursor:pointer;
  }

  /* ---------- header ---------- */
  header{
    max-width:1100px; margin:0 auto; padding:calc(72px + env(safe-area-inset-top)) 20px 28px;
    text-align:center;
  }
  .h-eyebrow{font-size:12.5px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--amber-bright); margin-bottom:10px;}
  .h-title{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(28px,6vw,42px); color:var(--foam); letter-spacing:-0.01em;}
  .h-sub{font-size:14.5px; color:var(--text-2); margin-top:10px;}
  .h-tour{
    margin-top:22px; display:inline-flex; align-items:center; gap:8px; font-family:inherit; font-size:13.5px; font-weight:700;
    color:var(--foam); background:var(--surface); border:1px solid var(--hairline-strong);
    padding:10px 18px; border-radius:999px; cursor:pointer;
  }
  .h-tour svg{width:14px; height:14px;}

  /* ---------- mosaic grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:190px; grid-auto-flow:dense;
    gap:10px; max-width:1100px; margin:0 auto; padding:0 20px calc(60px + env(safe-area-inset-bottom));
  }
  @media(max-width:860px){ .grid{grid-template-columns:repeat(3,1fr); grid-auto-rows:160px;} }
  @media(max-width:600px){ .grid{grid-template-columns:repeat(2,1fr); grid-auto-rows:150px; gap:8px;} }
  .tile{
    position:relative; grid-column:span 1; grid-row:span 1; border-radius:16px; overflow:hidden; cursor:pointer;
    background:var(--surface); border:1px solid var(--hairline);
    opacity:0; transform:translateY(14px); transition:opacity .6s ease, transform .6s cubic-bezier(.16,.7,.24,1);
  }
  .tile.in-view{opacity:1; transform:translateY(0);}
  .tile.big{grid-column:span 2; grid-row:span 2;}
  .tile.wide{grid-column:span 2; grid-row:span 1;}
  .tile img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .5s ease;}
  .tile:active img{transform:scale(1.04);}
  .tile-scrim{position:absolute; inset:0; background:linear-gradient(to bottom, rgba(12,8,4,0) 45%, rgba(10,7,4,0.88) 100%);}
  .tile-tx{position:absolute; left:0; right:0; bottom:0; padding:12px 14px;}
  .tile-name{font-family:'Fraunces',serif; font-weight:600; color:var(--foam); font-size:15px; line-height:1.2;}
  .tile.big .tile-name{font-size:22px;}
  .tile-brewery{font-size:11.5px; color:var(--text-2); margin-top:2px;}
  .tile-score{
    position:absolute; top:10px; right:10px; font-family:'Fraunces',serif; font-weight:700; font-size:13px; color:#241703;
    background:var(--amber-bright); padding:3px 8px; border-radius:999px; line-height:1.3;
  }

  /* ---------- summary strip ---------- */
  .summary{max-width:1100px; margin:0 auto; padding:20px 20px calc(80px + env(safe-area-inset-bottom));}
  .summary-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media(max-width:600px){ .summary-grid{grid-template-columns:repeat(2,1fr);} }
  .summary-tile{background:var(--surface); border:1px solid var(--hairline); border-radius:16px; padding:18px 10px; text-align:center;}
  .summary-n{font-family:'Fraunces',serif; font-weight:700; font-size:28px; color:var(--amber-bright);}
  .summary-l{font-size:12px; color:var(--text-3); margin-top:4px;}

  /* ---------- fixed chrome ---------- */
  .top-link{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:16px; z-index:20;
    font-size:13px; font-weight:600; color:var(--text-2); text-decoration:none;
    background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--hairline);
    padding:9px 15px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
  }
  .top-link svg{width:14px; height:14px;}

  /* ---------- detail modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; z-index:50; background:rgba(10,7,4,0.92); backdrop-filter:blur(6px);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal-card{
    width:100%; max-width:460px; max-height:calc(100vh - 40px); overflow-y:auto; border-radius:22px;
    background:var(--surface); border:1px solid var(--hairline-strong);
  }
  .modal-photo{position:relative; aspect-ratio:4/5; background:#0f0a05;}
  .modal-photo img{width:100%; height:100%; object-fit:cover;}
  .modal-close{
    position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(10,7,4,0.6); backdrop-filter:blur(8px); color:var(--foam); display:flex; align-items:center; justify-content:center;
  }
  .modal-close svg{width:16px; height:16px;}
  .modal-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(10,7,4,0.55); backdrop-filter:blur(8px); color:var(--foam); display:flex; align-items:center; justify-content:center;
  }
  .modal-nav svg{width:16px; height:16px;}
  .modal-prev{left:12px;} .modal-next{right:12px;}
  .modal-body{padding:22px 22px calc(26px + env(safe-area-inset-bottom));}
  .modal-eyebrow{font-size:12.5px; font-weight:700; color:var(--amber-bright); text-transform:uppercase; letter-spacing:0.06em;}
  .modal-name{font-family:'Fraunces',serif; font-weight:600; font-size:26px; color:var(--foam); margin-top:8px; line-height:1.15;}
  .modal-row{display:flex; align-items:baseline; gap:14px; margin-top:14px; flex-wrap:wrap;}
  .modal-score{font-family:'Fraunces',serif; font-weight:700; font-size:24px; color:var(--amber-bright);}
  .modal-score small{font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--text-3);}
  .modal-chip{font-size:11.5px; font-weight:600; color:var(--text-2); background:rgba(232,163,61,0.1); border:1px solid var(--hairline-strong); padding:3px 10px; border-radius:999px; margin-right:6px;}
  .modal-meta{font-size:12.5px; color:var(--text-3); margin-top:12px;}
  .modal-meta span:not(:last-child)::after{content:'·'; margin-left:7px; color:var(--text-4);}
  .modal-note{font-family:'Fraunces',serif; font-style:italic; font-size:15.5px; line-height:1.45; color:var(--text); margin-top:16px;}
</style>
</head>
<body>

  <div id="state" class="state-screen">
    <svg class="state-glass" width="52" height="60" viewBox="0 0 26 30"><path d="M4 3h18l-2 22a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3L4 3z" fill="none" stroke="var(--amber)" stroke-width="1.4"/></svg>
    <div class="state-title" id="state-title">Nalévám vitrínu…</div>
    <div class="state-sub" id="state-sub">Chvilku strpení, tahám nejlepší kousky z deníku.</div>
    <button class="state-btn" id="state-btn" style="display:none">Zkusit znovu</button>
  </div>

  <a class="top-link" id="top-link" href="index.html" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Deník
  </a>

  <div id="page" style="display:none">
    <header>
      <div class="h-eyebrow">Vitrína</div>
      <h1 class="h-title">Nejlepší kousky z deníku</h1>
      <div class="h-sub" id="h-count">— vybraných zápisů</div>
      <button class="h-tour" id="tour-btn">
        <svg id="tour-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l13 7-13 7V5z"/></svg>
        <span id="tour-label">Spustit prohlídku</span>
      </button>
    </header>
    <div class="grid" id="grid"></div>
    <div class="summary">
      <div class="summary-grid" id="summary-grid"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal-card" id="modal-card">
      <div class="modal-photo">
        <img id="modal-img" src="" alt="">
        <button class="modal-close" id="modal-close" aria-label="Zavřít"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
        <button class="modal-nav modal-prev" id="modal-prev" aria-label="Předchozí"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="modal-nav modal-next" id="modal-next" aria-label="Další"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="modal-eyebrow" id="modal-brewery"></div>
        <h2 class="modal-name" id="modal-name"></h2>
        <div class="modal-row">
          <div class="modal-score" id="modal-score"></div>
          <div id="modal-chips"></div>
        </div>
        <div class="modal-meta" id="modal-meta"></div>
        <p class="modal-note" id="modal-note" style="display:none"></p>
      </div>
    </div>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/pivovar\s+/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
  function czDate(iso){
    if(!iso) return '';
    const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!m) return iso;
    return parseInt(m[3],10)+'. '+parseInt(m[2],10)+'. '+m[1];
  }

  const CFG_KEY='pivni-denik-cfg-v1';
  const BUCKET='fotky';
  let cfg={url:'',key:''};
  try{ cfg=Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY))||{}); }catch(e){}

  // fall back to the same invite-link format the app uses, so a shared link works
  // even on a browser that has never opened the main app
  function parseInvite(){
    const h=location.hash||'';
    const m=h.match(/join=([^&]+)/);
    if(!m) return null;
    try{
      const json=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));
      const o=JSON.parse(json);
      if(o.url && o.key) return o;
    }catch(e){}
    return null;
  }
  const invite=parseInvite();
  if(invite){ cfg.url=invite.url; cfg.key=invite.key; history.replaceState(null,'',location.href.split('#')[0]); }

  function showState(title, sub, showRetry){
    $('#state-title').textContent=title;
    $('#state-sub').textContent=sub;
    $('#state-btn').style.display = showRetry ? 'inline-flex' : 'none';
  }
  $('#state-btn').addEventListener('click', ()=>location.reload());

  function backHref(){
    try{
      if(document.referrer){
        const r=new URL(document.referrer);
        if(r.origin===location.origin && !/vitrina/i.test(r.pathname)) return r.pathname+r.search;
      }
    }catch(e){}
    return 'index.html';
  }

  if(!cfg.url || !cfg.key){
    showState('Vitrína je zatím prázdná', 'Otevři tuhle stránku ze zvacího odkazu appky, nebo z prohlížeče, kde už máš pivní deník připojený k partě.', false);
    return;
  }

  const base=cfg.url.replace(/\/$/,'');
  const headers={ apikey:cfg.key, Authorization:'Bearer '+cfg.key };
  function storageUrl(path){ return base+'/storage/v1/object/public/'+BUCKET+'/'+path; }

  let cityByKey={};

  async function boot(){
    let piva, pivovary=[];
    try{
      const r=await fetch(base+'/rest/v1/piva?select=*&order=hodnoceni.desc', { headers });
      if(!r.ok) throw new Error('HTTP '+r.status);
      piva=await r.json();
    }catch(e){
      showState('Nejde se připojit', 'Zkontroluj připojení k internetu, nebo jestli je zvací odkaz ještě platný.', true);
      return;
    }
    try{
      const r2=await fetch(base+'/rest/v1/pivovary?select=klic,mesto', { headers });
      if(r2.ok) pivovary=await r2.json();
    }catch(e){ /* volitelný doplněk, bez něj se obejdeme */ }
    pivovary.forEach(p=>{ if(p.mesto) cityByKey[p.klic]=p.mesto; });

    if(!piva.length){
      showState('Vitrína je zatím prázdná', 'V deníku ještě nejsou žádná zapsaná piva.', false);
      return;
    }

    const withPhoto=piva.filter(x=>x.foto);
    const curated=withPhoto.filter(x=>x.vitrina);
    const picks = curated.length
      ? curated.slice().sort((a,b)=> (b.hodnoceni||0)-(a.hodnoceni||0) || (b.datum||'').localeCompare(a.datum||''))
      : withPhoto.slice().sort((a,b)=> (b.hodnoceni||0)-(a.hodnoceni||0) || (b.datum||'').localeCompare(a.datum||'')).slice(0,18);

    if(!picks.length){
      showState('Vitrína je zatím prázdná', 'Zatím žádné pivo nemá fotku — přidej ji u zápisu v appce, ať má vitrína co ukázat.', false);
      return;
    }

    const brewerySet=new Set(), placeSet=new Set(), styleSet=new Set();
    piva.forEach(x=>{
      if(x.pivovar) brewerySet.add(norm(x.pivovar));
      if(x.spolupivovar) brewerySet.add(norm(x.spolupivovar));
      if(x.kde) placeSet.add(x.kde.trim().toLowerCase());
      if(x.styl) styleSet.add(x.styl.trim().toLowerCase());
    });

    renderPage(picks, { beers:piva.length, breweries:brewerySet.size, places:placeSet.size, styles:styleSet.size });
  }

  const SIZE_CYCLE=['big','normal','normal','wide','normal','normal'];

  function renderPage(picks, stats){
    $('#state').style.display='none';
    $('#page').style.display='block';
    $('#top-link').style.display='inline-flex';
    $('#top-link').href=backHref();
    $('#h-count').textContent=picks.length+' vybraných zápisů';

    const grid=$('#grid');
    grid.innerHTML=picks.map((b,i)=>{
      const size=SIZE_CYCLE[i%SIZE_CYCLE.length];
      return '<div class="tile '+size+'" data-i="'+i+'">'
        +'<img loading="lazy" src="'+esc(storageUrl(b.foto))+'" alt="'+esc(b.nazev)+'">'
        +'<div class="tile-scrim"></div>'
        +(b.hodnoceni?'<div class="tile-score">'+Number(b.hodnoceni).toFixed(1)+'</div>':'')
        +'<div class="tile-tx"><div class="tile-name">'+esc(b.nazev)+'</div>'+(b.pivovar?'<div class="tile-brewery">'+esc(b.pivovar)+'</div>':'')+'</div>'
        +'</div>';
    }).join('');

    const sg=$('#summary-grid');
    sg.innerHTML=
      '<div class="summary-tile"><div class="summary-n">'+stats.beers+'</div><div class="summary-l">zapsaných piv</div></div>'
      +'<div class="summary-tile"><div class="summary-n">'+stats.breweries+'</div><div class="summary-l">pivovarů</div></div>'
      +'<div class="summary-tile"><div class="summary-n">'+stats.places+'</div><div class="summary-l">míst</div></div>'
      +'<div class="summary-tile"><div class="summary-n">'+stats.styles+'</div><div class="summary-l">stylů</div></div>';

    setupReveal();
    setupModal(picks);
  }

  function setupReveal(){
    const tiles=[...document.querySelectorAll('.tile')];
    const io=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold:0.15, rootMargin:'0px 0px -40px 0px' });
    tiles.forEach(t=>io.observe(t));
  }

  function setupModal(picks){
    const modal=$('#modal');
    let openIndex=-1;
    let timer=null;

    function paint(i){
      const b=picks[i]; if(!b) return;
      openIndex=i;
      const city=b.pivovar ? cityByKey[norm(b.pivovar)] : '';
      $('#modal-img').src=storageUrl(b.foto);
      $('#modal-img').alt=b.nazev||'';
      $('#modal-brewery').textContent=(b.pivovar||'')+(city?' · '+city:'');
      $('#modal-name').textContent=b.nazev||'';
      $('#modal-score').innerHTML = b.hodnoceni ? Number(b.hodnoceni).toFixed(1)+'<small>/10</small>' : '';
      const chips=[];
      if(b.styl) chips.push('<span class="modal-chip">'+esc(b.styl)+'</span>');
      if(b.abv) chips.push('<span class="modal-chip">'+esc(b.abv)+'%</span>');
      $('#modal-chips').innerHTML=chips.join('');
      const metaBits=[];
      if(b.datum) metaBits.push('<span>'+esc(czDate(b.datum))+'</span>');
      if(b.kde) metaBits.push('<span>'+esc(b.kde)+'</span>');
      if(b.cena) metaBits.push('<span>'+esc(b.cena)+' Kč</span>');
      if(b.osoba) metaBits.push('<span>zapsal(a) '+esc(b.osoba)+'</span>');
      $('#modal-meta').innerHTML=metaBits.join('');
      if(b.poznamka){ $('#modal-note').style.display='block'; $('#modal-note').textContent='„'+b.poznamka+'"'; }
      else { $('#modal-note').style.display='none'; }
      $('#modal-card').scrollTop=0;
    }
    function open(i){ paint(i); modal.classList.add('show'); }
    function close(){ modal.classList.remove('show'); stopTour(); }
    function step(dir){
      const next=openIndex+dir;
      if(next<0 || next>=picks.length){ if(dir>0) stopTour(); return; }
      paint(next);
    }

    $('#grid').addEventListener('click', e=>{
      const t=e.target.closest('.tile'); if(!t) return;
      open(parseInt(t.dataset.i,10));
    });
    $('#modal-close').addEventListener('click', close);
    $('#modal-prev').addEventListener('click', ()=>{ stopTour(); step(-1); });
    $('#modal-next').addEventListener('click', ()=>{ stopTour(); step(1); });
    modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
    document.addEventListener('keydown', e=>{
      if(!modal.classList.contains('show')) return;
      if(e.key==='Escape') close();
      if(e.key==='ArrowLeft'){ stopTour(); step(-1); }
      if(e.key==='ArrowRight'){ stopTour(); step(1); }
    });

    // guided tour: cycles through the tiles automatically, stops on any manual interaction
    const tourBtn=$('#tour-btn'), tourIcon=$('#tour-icon'), tourLabel=$('#tour-label');
    const PAUSE_ICON='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    const PLAY_ICON='<path d="M7 5l13 7-13 7V5z"/>';
    function startTour(){
      tourIcon.innerHTML=PAUSE_ICON; tourLabel.textContent='Pauza';
      if(!modal.classList.contains('show')) open(0);
      timer=setInterval(()=>step(1), 4000);
    }
    function stopTour(){
      if(timer){ clearInterval(timer); timer=null; }
      tourIcon.innerHTML=PLAY_ICON; tourLabel.textContent='Spustit prohlídku';
    }
    tourBtn.addEventListener('click', ()=>{ timer ? (stopTour(), close()) : startTour(); });
    ['wheel','touchstart','pointerdown'].forEach(evt=>{
      modal.addEventListener(evt, ()=>{ if(timer) stopTour(); }, { passive:true });
    });
  }

  boot();
})();
</script>
</body>
</html>
