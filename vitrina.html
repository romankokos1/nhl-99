<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a130b">
<title>Vitrína · Pivní deník</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
  :root{
    /* same palette as the main app — dark brown, warm amber */
    --bg:#191009;
    --bg-2:#1f150c;
    --surface:#251a0f;
    --surface-2:#2c2013;
    --glass:rgba(44,32,19,0.72);
    --hairline:rgba(232,163,61,0.14);
    --hairline-strong:rgba(232,163,61,0.24);
    --amber:#e8a33d;
    --amber-bright:#ffc35a;
    --amber-deep:#c07d24;
    --foam:#f7edd6;
    --text:#f2e7d2;
    --text-2:#c3ab86;
    --text-3:#8f795a;
    --text-4:#6b593f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  ::selection{background:var(--amber); color:#191009;}

  /* ---------- centered states (loading / error / needs-connection) ---------- */
  .state-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:40px; gap:16px;
    background:radial-gradient(ellipse at 50% 30%, #241708 0%, var(--bg) 70%);
  }
  .state-glass{opacity:0.85; animation:bob 2.6s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  .state-title{font-family:'Fraunces',serif; font-weight:600; font-size:26px; color:var(--foam);}
  .state-sub{font-size:14.5px; color:var(--text-2); max-width:340px; line-height:1.5;}
  .state-btn{
    margin-top:8px; font-family:inherit; font-size:14px; font-weight:700; color:#241703;
    background:linear-gradient(160deg, var(--amber-bright), var(--amber));
    border:none; padding:13px 24px; border-radius:999px; cursor:pointer;
  }

  /* ---------- scroller / slides ---------- */
  #scroller{
    position:fixed; inset:0; overflow-y:scroll; overflow-x:hidden;
    scroll-snap-type:y mandatory; scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
  }
  .slide{
    position:relative; height:100vh; width:100%; scroll-snap-align:start; scroll-snap-stop:always;
    display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden;
  }
  .slide-bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center;
    transform:scale(1.1); transition:transform 5s cubic-bezier(.16,.7,.24,1); filter:saturate(1.02);}
  .slide.in-view .slide-bg{transform:scale(1);}
  .slide-scrim{position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(12,8,4,0.15) 0%, rgba(12,8,4,0.1) 32%, rgba(15,10,5,0.75) 72%, rgba(12,8,4,0.96) 100%);}
  .slide-content{position:relative; z-index:2; padding:0 24px calc(96px + env(safe-area-inset-bottom));
    opacity:0; transform:translateY(28px); transition:opacity .9s ease, transform .9s cubic-bezier(.16,.7,.24,1);
    max-width:560px;}
  .slide.in-view .slide-content{opacity:1; transform:translateY(0);}
  .slide-eyebrow{font-size:12.5px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--amber-bright); margin-bottom:10px;}
  .slide-name{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(30px,8vw,52px); line-height:1.06; color:var(--foam); letter-spacing:-0.01em;}
  .slide-brewery{font-size:16.5px; color:var(--text-2); margin-top:8px; font-weight:500;}
  .slide-row{display:flex; align-items:baseline; gap:16px; margin-top:18px; flex-wrap:wrap;}
  .slide-score{font-family:'Fraunces',serif; font-weight:700; font-size:34px; color:var(--amber-bright); line-height:1;}
  .slide-score small{font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--text-3); margin-left:2px;}
  .slide-chips{display:flex; gap:8px; flex-wrap:wrap;}
  .slide-chip{font-size:12px; font-weight:600; color:var(--text-2); background:rgba(232,163,61,0.1); border:1px solid var(--hairline-strong); padding:4px 11px; border-radius:999px;}
  .slide-meta{font-size:13px; color:var(--text-3); margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .slide-meta span:not(:last-child)::after{content:'·'; margin-left:8px; color:var(--text-4);}
  .slide-note{font-family:'Fraunces',serif; font-style:italic; font-weight:500; font-size:16.5px; line-height:1.45; color:var(--text); margin-top:18px; max-width:480px;}

  /* ---------- intro slide ---------- */
  .slide-intro{background:radial-gradient(ellipse 120% 70% at 50% 20%, #2c1c0c 0%, var(--bg) 65%);}
  .slide-intro .slide-content{padding-bottom:0; max-width:520px; margin:0 auto; text-align:center; align-items:center;}
  .intro-count{font-size:14px; color:var(--text-2); margin-top:14px;}
  .intro-hint{margin-top:44px; font-size:12.5px; color:var(--text-4); display:flex; flex-direction:column; align-items:center; gap:6px;}
  .intro-chev{animation:chevbounce 1.8s ease-in-out infinite;}
  @keyframes chevbounce{0%,100%{transform:translateY(0); opacity:0.5;}50%{transform:translateY(6px); opacity:1;}}
  .intro-cta{margin-top:26px;}

  /* ---------- summary slide ---------- */
  .slide-summary{background:radial-gradient(ellipse 120% 70% at 50% 80%, #2c1c0c 0%, var(--bg) 65%); justify-content:center;}
  .slide-summary .slide-content{opacity:1; transform:none; max-width:560px; margin:0 auto; text-align:center; padding-bottom:0;}
  .summary-title{font-family:'Fraunces',serif; font-weight:600; font-size:clamp(26px,6vw,38px); color:var(--foam);}
  .summary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-top:32px;}
  .summary-tile{background:var(--surface); border:1px solid var(--hairline); border-radius:18px; padding:20px 12px;}
  .summary-n{font-family:'Fraunces',serif; font-weight:700; font-size:32px; color:var(--amber-bright);}
  .summary-l{font-size:12.5px; color:var(--text-3); margin-top:4px;}
  .summary-back{
    display:inline-flex; align-items:center; gap:8px; margin-top:36px; font-family:inherit; font-size:14.5px; font-weight:700;
    color:#241703; background:linear-gradient(160deg, var(--amber-bright), var(--amber));
    border:none; padding:15px 28px; border-radius:999px; cursor:pointer; text-decoration:none;
  }

  /* ---------- fixed chrome ---------- */
  .top-link{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:16px; z-index:10;
    font-size:13px; font-weight:600; color:var(--text-2); text-decoration:none;
    background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--hairline);
    padding:9px 15px; border-radius:999px; display:inline-flex; align-items:center; gap:6px;
  }
  .top-link svg{width:14px; height:14px;}
  #controls{
    position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:10;
    display:flex; align-items:center; gap:10px;
    background:var(--glass); backdrop-filter:blur(20px) saturate(1.3); border:1px solid var(--hairline);
    padding:8px 8px 8px 16px; border-radius:999px; opacity:0; transition:opacity .4s ease; pointer-events:none;
  }
  #controls.show{opacity:1; pointer-events:auto;}
  #progress-tx{font-variant-numeric:tabular-nums; font-size:12px; font-weight:600; color:var(--text-3); min-width:44px;}
  #play-toggle{
    width:36px; height:36px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(160deg, var(--amber-bright), var(--amber)); color:#241703;
    display:flex; align-items:center; justify-content:center;
  }
  #play-toggle svg{width:16px; height:16px;}
</style>
</head>
<body>

  <div id="state" class="state-screen">
    <svg class="state-glass" width="52" height="60" viewBox="0 0 26 30"><path d="M4 3h18l-2 22a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3L4 3z" fill="none" stroke="var(--amber)" stroke-width="1.4"/></svg>
    <div class="state-title" id="state-title">Nalévám vitrínu…</div>
    <div class="state-sub" id="state-sub">Chvilku strpení, tahám nejlepší kousky z deníku.</div>
    <button class="state-btn" id="state-btn" style="display:none">Zkusit znovu</button>
  </div>

  <a class="top-link" id="top-link" href="index.html" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Deník
  </a>

  <div id="scroller" style="display:none"></div>

  <div id="controls">
    <span id="progress-tx">1 / 1</span>
    <button id="play-toggle" aria-label="Spustit prohlídku">
      <svg id="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l13 7-13 7V5z"/></svg>
    </button>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/pivovar\s+/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
  function czDate(iso){
    if(!iso) return '';
    const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!m) return iso;
    return parseInt(m[3],10)+'. '+parseInt(m[2],10)+'. '+m[1];
  }

  const CFG_KEY='pivni-denik-cfg-v1';
  const BUCKET='fotky';
  let cfg={url:'',key:''};
  try{ cfg=Object.assign(cfg, JSON.parse(localStorage.getItem(CFG_KEY))||{}); }catch(e){}

  // fall back to the same invite-link format the app uses, so a shared link works
  // even on a browser that has never opened the main app
  function parseInvite(){
    const h=location.hash||'';
    const m=h.match(/join=([^&]+)/);
    if(!m) return null;
    try{
      const json=decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))));
      const o=JSON.parse(json);
      if(o.url && o.key) return o;
    }catch(e){}
    return null;
  }
  const invite=parseInvite();
  if(invite){ cfg.url=invite.url; cfg.key=invite.key; history.replaceState(null,'',location.href.split('#')[0]); }

  function showState(title, sub, showRetry){
    $('#state-title').textContent=title;
    $('#state-sub').textContent=sub;
    $('#state-btn').style.display = showRetry ? 'inline-flex' : 'none';
  }
  $('#state-btn').addEventListener('click', ()=>location.reload());

  // back link: prefer the page we were actually opened from, if it's this same site
  function backHref(){
    try{
      if(document.referrer){
        const r=new URL(document.referrer);
        if(r.origin===location.origin && !/vitrina/i.test(r.pathname)) return r.pathname+r.search;
      }
    }catch(e){}
    return 'index.html';
  }

  if(!cfg.url || !cfg.key){
    showState('Vitrína je zatím prázdná', 'Otevři tuhle stránku ze zvacího odkazu appky, nebo z prohlížeče, kde už máš pivní deník připojený k partě.', false);
    return;
  }

  const base=cfg.url.replace(/\/$/,'');
  const headers={ apikey:cfg.key, Authorization:'Bearer '+cfg.key };
  function storageUrl(path){ return base+'/storage/v1/object/public/'+BUCKET+'/'+path; }

  async function boot(){
    let piva, pivovary=[];
    try{
      const r=await fetch(base+'/rest/v1/piva?select=*&order=hodnoceni.desc', { headers });
      if(!r.ok) throw new Error('HTTP '+r.status);
      piva=await r.json();
    }catch(e){
      showState('Nejde se připojit', 'Zkontroluj připojení k internetu, nebo jestli je zvací odkaz ještě platný.', true);
      return;
    }
    try{
      const r2=await fetch(base+'/rest/v1/pivovary?select=klic,mesto', { headers });
      if(r2.ok) pivovary=await r2.json();
    }catch(e){ /* volitelný doplněk, bez něj se obejdeme */ }
    const cityByKey={};
    pivovary.forEach(p=>{ if(p.mesto) cityByKey[p.klic]=p.mesto; });

    if(!piva.length){
      showState('Vitrína je zatím prázdná', 'V deníku ještě nejsou žádná zapsaná piva.', false);
      return;
    }

    const withPhoto=piva.filter(x=>x.foto);
    let curated=withPhoto.filter(x=>x.vitrina);
    let picks = curated.length ? curated : withPhoto.slice().sort((a,b)=> (b.hodnoceni||0)-(a.hodnoceni||0) || (b.datum||'').localeCompare(a.datum||'')).slice(0,18);

    if(!picks.length){
      showState('Vitrína je zatím prázdná', 'Zatím žádné pivo nemá fotku — přidej ji u zápisu v appce, ať má vitrína co ukázat.', false);
      return;
    }
    if(curated.length){
      picks=picks.slice().sort((a,b)=> (b.hodnoceni||0)-(a.hodnoceni||0) || (b.datum||'').localeCompare(a.datum||''));
    }

    // aggregate stats across the WHOLE diary, not just the showcased picks
    const brewerySet=new Set();
    const placeSet=new Set();
    const styleSet=new Set();
    const peopleSet=new Set();
    piva.forEach(x=>{
      if(x.pivovar) brewerySet.add(norm(x.pivovar));
      if(x.spolupivovar) brewerySet.add(norm(x.spolupivovar));
      if(x.kde) placeSet.add(x.kde.trim().toLowerCase());
      if(x.styl) styleSet.add(x.styl.trim().toLowerCase());
      if(x.osoba) peopleSet.add(x.osoba);
    });

    renderSlides(picks, cityByKey, {
      beers: piva.length, breweries: brewerySet.size, places: placeSet.size, styles: styleSet.size, people: peopleSet.size
    });
  }

  function renderSlides(picks, cityByKey, stats){
    const scroller=$('#scroller');
    let html='';

    html+='<section class="slide slide-intro" id="slide-intro">'
      +'<div class="slide-content">'
      +'<div class="slide-eyebrow">Vitrína</div>'
      +'<h1 class="slide-name">Nejlepší kousky z deníku</h1>'
      +'<div class="intro-count">'+picks.length+' vybraných zápisů</div>'
      +'<div class="intro-hint"><span>scrolluj nebo spusť prohlídku</span><svg class="intro-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
      +'</div></section>';

    picks.forEach((b,i)=>{
      const city=b.pivovar ? cityByKey[norm(b.pivovar)] : '';
      const chips=[];
      if(b.styl) chips.push('<span class="slide-chip">'+esc(b.styl)+'</span>');
      if(b.abv) chips.push('<span class="slide-chip">'+esc(b.abv)+'%</span>');
      const metaBits=[];
      if(b.datum) metaBits.push('<span>'+esc(czDate(b.datum))+'</span>');
      if(b.kde) metaBits.push('<span>'+esc(b.kde)+'</span>');
      if(b.cena) metaBits.push('<span>'+esc(b.cena)+' Kč</span>');
      if(b.osoba) metaBits.push('<span>zapsal(a) '+esc(b.osoba)+'</span>');
      html+='<section class="slide" data-index="'+(i+1)+'">'
        +'<img class="slide-bg" loading="lazy" src="'+esc(storageUrl(b.foto))+'" alt="'+esc(b.nazev)+'">'
        +'<div class="slide-scrim"></div>'
        +'<div class="slide-content">'
        +(b.pivovar?'<div class="slide-eyebrow">'+esc(b.pivovar)+(city?' · '+esc(city):'')+'</div>':'')
        +'<h2 class="slide-name">'+esc(b.nazev)+'</h2>'
        +'<div class="slide-row">'
        +(b.hodnoceni?'<div class="slide-score">'+Number(b.hodnoceni).toFixed(1)+'<small>/10</small></div>':'')
        +(chips.length?'<div class="slide-chips">'+chips.join('')+'</div>':'')
        +'</div>'
        +(metaBits.length?'<div class="slide-meta">'+metaBits.join('')+'</div>':'')
        +(b.poznamka?'<p class="slide-note">„'+esc(b.poznamka)+'"</p>':'')
        +'</div></section>';
    });

    html+='<section class="slide slide-summary" id="slide-summary">'
      +'<div class="slide-content">'
      +'<div class="summary-title">Zatím v deníku</div>'
      +'<div class="summary-grid">'
      +'<div class="summary-tile"><div class="summary-n">'+stats.beers+'</div><div class="summary-l">zapsaných piv</div></div>'
      +'<div class="summary-tile"><div class="summary-n">'+stats.breweries+'</div><div class="summary-l">pivovarů</div></div>'
      +'<div class="summary-tile"><div class="summary-n">'+stats.places+'</div><div class="summary-l">míst</div></div>'
      +'<div class="summary-tile"><div class="summary-n">'+stats.styles+'</div><div class="summary-l">stylů</div></div>'
      +'</div>'
      +'<a class="summary-back" href="'+esc(backHref())+'">Zpět do deníku</a>'
      +'</div></section>';

    scroller.innerHTML=html;
    scroller.style.display='block';
    $('#state').style.display='none';
    $('#top-link').style.display='inline-flex';
    $('#top-link').href=backHref();
    $('#controls').classList.add('show');
    $('#progress-tx').textContent='1 / '+(picks.length+2);

    setupReveal();
    setupProgress(picks.length+2);
    setupAutoplay();
  }

  function setupReveal(){
    const slides=[...document.querySelectorAll('.slide')];
    const io=new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ e.target.classList.toggle('in-view', e.isIntersecting && e.intersectionRatio>0.55); });
    }, { root:$('#scroller'), threshold:[0,0.55,1] });
    slides.forEach(s=>io.observe(s));
  }

  function setupProgress(total){
    const scroller=$('#scroller');
    let raf=null;
    scroller.addEventListener('scroll', ()=>{
      if(raf) return;
      raf=requestAnimationFrame(()=>{
        raf=null;
        const idx=Math.round(scroller.scrollTop/scroller.clientHeight);
        $('#progress-tx').textContent=(Math.min(idx,total-1)+1)+' / '+total;
      });
    }, { passive:true });
  }

  function setupAutoplay(){
    const scroller=$('#scroller');
    const btn=$('#play-toggle');
    const icon=$('#play-icon');
    const PAUSE_ICON='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
    const PLAY_ICON='<path d="M7 5l13 7-13 7V5z"/>';
    let timer=null;

    function stop(){
      if(timer){ clearInterval(timer); timer=null; icon.innerHTML=PLAY_ICON; btn.setAttribute('aria-label','Spustit prohlídku'); }
    }
    function start(){
      icon.innerHTML=PAUSE_ICON; btn.setAttribute('aria-label','Pauza');
      timer=setInterval(()=>{
        const slides=[...document.querySelectorAll('.slide')];
        const h=scroller.clientHeight;
        const idx=Math.round(scroller.scrollTop/h);
        const next=idx+1;
        if(next>=slides.length){ stop(); return; }
        scroller.scrollTo({ top:next*h, behavior:'smooth' });
      }, 4000);
    }
    btn.addEventListener('click', ()=>{ timer ? stop() : start(); });
    ['wheel','touchstart','pointerdown'].forEach(evt=>{
      scroller.addEventListener(evt, ()=>{ if(timer) stop(); }, { passive:true });
    });
  }

  boot();
})();
</script>
</body>
</html>
