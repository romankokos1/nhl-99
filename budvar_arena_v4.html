<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budvar Aréna 3D</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d1219}
  canvas{display:block}
  #ui{position:absolute;top:18px;left:20px;font-family:'Arial Narrow',Arial,sans-serif;color:#fff;pointer-events:none}
  #ui h1{font-size:1.4rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;line-height:1}
  #ui h1 span{color:#C8102E}
  #ui p{font-size:.62rem;letter-spacing:.13em;color:#5a7090;margin-top:4px;text-transform:uppercase}
  #views{position:absolute;top:18px;right:18px;display:flex;flex-direction:column;gap:7px}
  .vbtn{background:rgba(10,16,26,.8);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.7);
    font-family:Arial,sans-serif;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
    padding:8px 14px;cursor:pointer;border-radius:2px;transition:border-color .2s,color .2s}
  .vbtn:hover,.vbtn.active{border-color:#C8102E;color:#fff}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;
    font-size:.62rem;letter-spacing:.1em;color:rgba(255,255,255,.2);text-transform:uppercase;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="ui">
  <h1>Budvar <span>Aréna</span></h1>
  <p>HC Motor České Budějovice · est. 1946</p>
</div>
<div id="views">
  <button class="vbtn active" onclick="setView('main')" id="v-main">Vstup (jih)</button>
  <button class="vbtn" onclick="setView('nw')" id="v-nw">SZ roh</button>
  <button class="vbtn" onclick="setView('top')" id="v-top">Shora</button>
  <button class="vbtn" onclick="setView('north')" id="v-north">Sever</button>
</div>
<div id="hint">Táhni: otáčení · Kolečko: zoom · Pravé tlač: posun</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="gltf-loader.js"></script>
<script>
// ── RENDERER ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1219);
scene.fog = new THREE.FogExp2(0x0d1219, 0.006);

const camera = new THREE.PerspectiveCamera(44,innerWidth/innerHeight,0.1,600);

// ── LIGHTS ────────────────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x8899bb, 0.55));
const sun = new THREE.DirectionalLight(0xfff8e0, 1.5);
sun.position.set(25,55,40);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -80;
sun.shadow.camera.right = sun.shadow.camera.top = 80;
sun.shadow.camera.far = 220;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x4466cc, 0.25);
fill.position.set(-30,18,-20);
scene.add(fill);
const back = new THREE.DirectionalLight(0xffffff, 0.12);
back.position.set(0,8,-50);
scene.add(back);

// ── MATERIALS ─────────────────────────────────────────────────────────────
const M = {
  white:   new THREE.MeshLambertMaterial({color:0xe8ecef}),
  grey:    new THREE.MeshLambertMaterial({color:0xc0cad2}),
  darkW:   new THREE.MeshLambertMaterial({color:0x3a4550}),  // tmavá západ stěna
  roofTop: new THREE.MeshLambertMaterial({color:0xd8dfe4}),  // světlá střecha (shora)
  roofBot: new THREE.MeshLambertMaterial({color:0x2e3a44}),  // tmavý spodek + lamely
  roofEdge:new THREE.MeshLambertMaterial({color:0x8a9aaa}),  // válcový lem
  glass:   new THREE.MeshLambertMaterial({color:0x3a6888,transparent:true,opacity:0.6}),
  glFrame: new THREE.MeshLambertMaterial({color:0x1e2c38}),
  pillar:  new THREE.MeshLambertMaterial({color:0xe0e6ea}),  // bílé sloupy
  ground:  new THREE.MeshLambertMaterial({color:0x141b24}),
  asphalt: new THREE.MeshLambertMaterial({color:0x1a2230}),
  concrete:new THREE.MeshLambertMaterial({color:0xb0bcc5}),
  red:     new THREE.MeshLambertMaterial({color:0xC8102E}),
  steel:   new THREE.MeshLambertMaterial({color:0x8899aa}),
  lamel:   new THREE.MeshLambertMaterial({color:0x5a6a78}),
};

// ── HELPERS ───────────────────────────────────────────────────────────────
function mesh(geo,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; m.receiveShadow=true;
  targetGroup.add(m); return m;
}
function box(w,h,d,mat,x,y,z,ry=0){
  return mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z,0,ry,0);
}
function cyl(rt,rb,h,seg,mat,x,y,z,rx=0,ry=0,rz=0){
  return mesh(new THREE.CylinderGeometry(rt,rb,h,seg,1,false),mat,x,y,z,rx,ry,rz);
}
function cylOpen(rt,rb,h,seg,mat,x,y,z,rx=0,ry=0,rz=0){
  return mesh(new THREE.CylinderGeometry(rt,rb,h,seg,1,true),mat,x,y,z,rx,ry,rz);
}
function addGeo(verts,idx,mat){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(verts),3));
  geo.setIndex(new THREE.BufferAttribute(new Uint16Array(idx),1));
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,mat); m.castShadow=true; m.receiveShadow=true;
  targetGroup.add(m); return m;
}

// targetGroup určuje, kam nově vytvořené meshe (mesh()/box()/cyl()/addGeo())
// přibývají. Ground/stromy/lampy jdou přímo do scény (jako doteď).
// Budova jde do vlastní skupiny 'buildingGroup', kterou lze celou schovat
// najednou, pokud se úspěšně načte GLB náhrada.
let targetGroup = scene;

// ── ROZMĚRY ───────────────────────────────────────────────────────────────
// Hlavní hala: orientace S-J
// Model: S=-HD/2, J=+HD/2, Z=-HW/2, V=+HW/2
const HW=26, HD=36;       // šířka V-Z, hloubka S-J
const HHn=16, HHj=10;     // výška sever, výška jih
const avgH=(HHn+HHj)/2;

// ── GROUND ────────────────────────────────────────────────────────────────
mesh(new THREE.PlaneGeometry(220,220),M.ground,0,0,0,-Math.PI/2);
box(42,0.06,30,M.asphalt, 5,0.03, HD/2+12); // parkoviště jih
box(35,0.08,4, M.concrete,5,0.04, HD/2+2);  // chodník

// ── HLAVNÍ HALA — tělo ───────────────────────────────────────────────────
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);
targetGroup = buildingGroup;   // od teď až po konec budovy jde vše sem

box(HW, avgH, HD, M.grey, 0, avgH/2, 0);

// ── ŠIKMÁ STŘECHA ─────────────────────────────────────────────────────────
// Klesá od severu (HHn) k jihu (HHj), přečnívá na jih o ~9 jednotek
{
  const ovN=2, ovS=9, ovW=1.5, ovE=1.5;
  // Horní plocha
  addGeo([
    -HW/2-ovW, HHn+0.2, -HD/2-ovN,
     HW/2+ovE, HHn+0.2, -HD/2-ovN,
     HW/2+ovE, HHj-0.3,  HD/2+ovS,
    -HW/2-ovW, HHj-0.3,  HD/2+ovS,
  ],[0,2,1,0,3,2], M.roofTop);

  // Spodní strana přečnívající části (viditelná ze vstupu — tmavé lamely)
  addGeo([
    -HW/2-ovW, HHj-0.35, HD/2+ovS,
     HW/2+ovE, HHj-0.35, HD/2+ovS,
     HW/2+ovE, HHj-0.05, HD/2,
    -HW/2-ovW, HHj-0.05, HD/2,
  ],[0,1,2,0,2,3], M.roofBot);

  // Boky střechy Z a V
  addGeo([
    -HW/2-ovW, HHn+0.2, -HD/2-ovN,
    -HW/2-ovW, HHj-0.3,  HD/2+ovS,
    -HW/2-ovW, HHj,      HD/2,
    -HW/2-ovW, HHn,     -HD/2,
  ],[0,1,3,1,2,3], M.roofTop);
  addGeo([
     HW/2+ovE, HHn+0.2, -HD/2-ovN,
     HW/2+ovE, HHj-0.3,  HD/2+ovS,
     HW/2+ovE, HHj,      HD/2,
     HW/2+ovE, HHn,     -HD/2,
  ],[0,3,1,1,3,2], M.roofTop);
}

// Lamely na spodku přečnívající střechy
for(let i=0;i<7;i++){
  const lz = HD/2+0.8+i*1.2;
  const ly = HHj-0.1-i*0.04;
  box(HW+3.2, 0.14, 0.2, M.lamel, 0, ly, lz);
}

// Válcový lem přední hrany střechy
cyl(0.8,0.8,HW+3.5,14,M.roofEdge, 0,HHj-0.45,HD/2+9, 0,0,Math.PI/2);

// ── SEVERNÍ STĚNA — bílá s lamelami ──────────────────────────────────────
box(HW, HHn, 0.3, M.white, 0, HHn/2, -HD/2);
for(let j=1;j<7;j++) box(HW+0.2, 0.2, 0.5, M.grey, 0, j*(HHn/7), -HD/2-0.2);

// ── ZÁPADNÍ STĚNA — tmavá s logem ────────────────────────────────────────
box(0.4, avgH, HD, M.darkW, -HW/2, avgH/2, 0);
// Logo Motor — červený čtverec
box(3.2, 3.2, 0.2, M.red, -HW/2-0.15, avgH*0.65, -2);

// ── VÝCHODNÍ STĚNA ────────────────────────────────────────────────────────
box(0.4, avgH, HD, M.grey, HW/2, avgH/2, 0);

// ── JIŽNÍ FASÁDA — rovná stěna + válcová věž + schodišťová věž ───────────
// Jižní stěna (zbytek po stranách věží)
box((HW-14)*0.5, HHj, 0.3, M.white, -HW/2+(HW-14)*0.25, HHj/2, HD/2);
box((HW-14)*0.5, HHj, 0.3, M.white,  HW/2-(HW-14)*0.25, HHj/2, HD/2);

// ── VÁLCOVÁ VĚŽ (jih, vlevo/západ) ───────────────────────────────────────
const TR=5.5, TX=-5, TZ=HD/2, TH1=4.5, TH2=3.0;

// Přízemí — válcová stěna ~270° (otevřena dovnitř haly)
const tSegs=24;
for(let i=0;i<tSegs;i++){
  const a1=-Math.PI*0.18 + i*(Math.PI*1.36/tSegs);
  const a2=-Math.PI*0.18 + (i+1)*(Math.PI*1.36/tSegs);
  const mx=TX+(Math.cos(a1)+Math.cos(a2))/2*TR;
  const mz=TZ+(Math.sin(a1)+Math.sin(a2))/2*TR;
  const ang=Math.atan2(Math.cos(a2)-Math.cos(a1),Math.sin(a2)-Math.sin(a1));
  const segW=TR*Math.PI*1.36/tSegs+0.1;
  box(segW, TH1, 0.25, M.white, mx, TH1/2, mz, -ang);
}

// Sloupy pod věží — 5 masivních bílých
const colAngles=[-0.6,-0.25,0.1,0.45,0.8];
colAngles.forEach(a=>{
  const cx=TX+Math.sin(a)*(TR*0.8);
  const cz=TZ+Math.cos(a)*(TR*0.8);
  cyl(0.35,0.38,TH1+TH2+0.5,10,M.pillar,cx,(TH1+TH2+0.5)/2,cz);
});

// Patro věže — prosklené
for(let i=0;i<tSegs;i++){
  const a1=-Math.PI*0.15+i*(Math.PI*1.3/tSegs);
  const a2=-Math.PI*0.15+(i+1)*(Math.PI*1.3/tSegs);
  const mx=TX+(Math.cos(a1)+Math.cos(a2))/2*(TR+0.1);
  const mz=TZ+(Math.sin(a1)+Math.sin(a2))/2*(TR+0.1);
  const ang=Math.atan2(Math.cos(a2)-Math.cos(a1),Math.sin(a2)-Math.sin(a1));
  const segW=TR*Math.PI*1.3/tSegs+0.1;
  box(segW, TH2, 0.18, i%3===1?M.glFrame:M.glass, mx, TH1+TH2/2, mz, -ang);
}

// Lem věže (nahoře a dole)
cyl(TR+0.3,TR+0.3,0.45,32,M.white,TX,TH1+TH2+0.22,TZ);
cyl(TR+0.2,TR+0.2,0.35,32,M.white,TX,0.18,TZ);
// Střední lem (mezi přízemím a patrem)
cyl(TR+0.25,TR+0.25,0.3,32,M.grey,TX,TH1+0.15,TZ);

// Nápis placeholder (červený pruh)
box(TR*1.1, 0.5, 0.08, M.red, TX, TH1+TH2*0.25, TZ+TR+0.05);

// ── SCHODIŠŤOVÁ VĚŽ (jih, vpravo/východ) ────────────────────────────────
const SX=8, SZ=HD/2+1;
// Hlavní tělo
box(5.5, HHj, 3, M.grey, SX, HHj/2, SZ);
// Balkóny (2 úrovně)
box(6.5,0.25,2.5,M.concrete, SX, TH1+0.1, SZ+0.5);
box(6.5,0.25,2.5,M.concrete, SX, TH1+TH2+0.1, SZ+0.5);
// Schodiště (přímé, ocelové)
for(let s=0;s<6;s++){
  box(3,0.15,1,M.steel, SX+0.5, 0.5+s*1.5, SZ+2.5+s*0.4);
}
// Zábradlí
box(0.08,3.5,0.08,M.steel,SX-1.2,1.75,SZ+2.5);
box(0.08,3.5,0.08,M.steel,SX+2.2,1.75,SZ+2.5);
box(3.5,0.08,0.08,M.steel,SX+0.5,3.5,SZ+2.5);
// Balkónová zábradlí
box(6.5,0.08,0.08,M.steel,SX,TH1+0.6,SZ+1.7);
box(6.5,0.08,0.08,M.steel,SX,TH1+TH2+0.6,SZ+1.7);

// ── OBLÝ SZ ROH ───────────────────────────────────────────────────────────
const cnR=4.5, cnX=-HW/2, cnZ=-HD/2;
const cnSegs=12;
for(let i=0;i<cnSegs;i++){
  const a1=Math.PI+(i/cnSegs)*Math.PI*0.5;
  const a2=Math.PI+((i+1)/cnSegs)*Math.PI*0.5;
  const mx=cnX+cnR*(Math.cos(a1)+Math.cos(a2))/2;
  const mz=cnZ+cnR*(Math.sin(a1)+Math.sin(a2))/2;
  const ang=Math.atan2((Math.sin(a2)-Math.sin(a1)),(Math.cos(a2)-Math.cos(a1)));
  box(0.3, HHn, 0.5, M.white, mx, HHn/2, mz, ang+Math.PI/2);
  // Horní část prosklená
  box(0.2, HHn*0.35, 0.35, M.glass, mx, HHn*0.78, mz, ang+Math.PI/2);
}

// ── TRÉNINKOVÁ HALA (jih, za průchodem) ──────────────────────────────────
const TrW=20, TrH=7.5, TrD=22;
box(TrW, TrH, TrD, M.white, 2, TrH/2, HD/2+TrD/2+2.5);
// Střecha tréninkovky — mírně šikmá
addGeo([
  -TrW/2-0.5, TrH,    HD/2+2.3,
   TrW/2+0.5, TrH,    HD/2+2.3,
  -TrW/2-0.5, TrH+1.5,HD/2+TrD+2.8,
   TrW/2+0.5, TrH+1.5,HD/2+TrD+2.8,
],[0,2,1,1,2,3], M.roofTop);
box(0.3,TrH,TrD,M.grey, 2-TrW/2,TrH/2,HD/2+TrD/2+2.5);
box(0.3,TrH,TrD,M.grey, 2+TrW/2,TrH/2,HD/2+TrD/2+2.5);
box(TrW,0.3,0.3,M.grey, 2,TrH, HD/2+2.5);

// ── PROSKLENÁ BUDOVA VÝCHOD (zázemí) ─────────────────────────────────────
const GBx=HW/2+7;
box(10,13,22,M.grey, GBx,6.5,0);
// Prosklená fasáda
for(let r=0;r<4;r++) for(let c=0;c<3;c++){
  box(2.2,2.5,0.15,M.glass, GBx-3.5+c*3.3, 2+r*3, -8);
  box(2.2,2.5,0.15,M.glass, GBx-3.5+c*3.3, 2+r*3,  8);
}
// Rámy
box(0.15,13,22,M.glFrame, GBx-5.15,6.5,0);
box(0.15,13,22,M.glFrame, GBx+5.15,6.5,0);

// ── STROMY ────────────────────────────────────────────────────────────────
targetGroup = scene;   // konec budovy — stromy a lampy jdou zase přímo do scény
function tree(x,z,h=5,r=2){
  cyl(0.2,0.25,h*0.4,6,M.darkW,x,h*0.2,z);
  const c=new THREE.Mesh(new THREE.SphereGeometry(r,8,5),
    new THREE.MeshLambertMaterial({color:0x253d20}));
  c.position.set(x,h*0.52,z); c.castShadow=true; scene.add(c);
}
tree(-22,4,5.5,2.2); tree(-24,-6,5,1.8); tree(-23,12,6,2.3);
tree(-22,-18,4.5,1.6); tree(20,-26,4.5,1.7); tree(24,-22,5,1.9);
tree(-16,28,4,1.5); tree(12,32,4.5,1.8);

// ── LAMPY ────────────────────────────────────────────────────────────────
function lamp(x,z){
  cyl(0.07,0.07,6,5,M.steel,x,3,z);
  const g=new THREE.Mesh(new THREE.SphereGeometry(0.22,6,4),
    new THREE.MeshLambertMaterial({color:0xffffcc,emissive:0xffff88,emissiveIntensity:0.4}));
  g.position.set(x,6.2,z); scene.add(g);
}
lamp(18,16); lamp(18,4); lamp(26,10); lamp(26,-2);

// ── GRID ─────────────────────────────────────────────────────────────────
const grid=new THREE.GridHelper(160,50,0x1a2535,0x141c28);
grid.position.y=0.02; scene.add(grid);

// ── ORBIT CONTROLS ────────────────────────────────────────────────────────
let drag=false,rclick=false,px=0,py=0;
let theta=1.9, phi=0.55, radius=88;
const target=new THREE.Vector3(2,7,6);

function updateCam(){
  camera.position.set(
    target.x+radius*Math.sin(phi)*Math.sin(theta),
    target.y+radius*Math.cos(phi),
    target.z+radius*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(target);
}
updateCam();

renderer.domElement.addEventListener('mousedown',e=>{drag=true;rclick=e.button===2;px=e.clientX;py=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const dx=e.clientX-px,dy=e.clientY-py;
  if(rclick){target.x-=dx*0.04*Math.cos(theta);target.z+=dx*0.04*Math.sin(theta);target.y+=dy*0.04;}
  else{theta-=dx*0.007;phi=Math.max(0.05,Math.min(Math.PI*0.47,phi+dy*0.005));}
  px=e.clientX;py=e.clientY;updateCam();
});
renderer.domElement.addEventListener('wheel',e=>{
  radius=Math.max(12,Math.min(170,radius+e.deltaY*0.07));updateCam();
});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());

// ── PRESET VIEWS ──────────────────────────────────────────────────────────
const views={
  main:  {theta:1.9,  phi:0.52, r:85,  tx:2,  ty:7,  tz:8},
  nw:    {theta:3.82, phi:0.48, r:75,  tx:-5, ty:8,  tz:-8},
  top:   {theta:2.1,  phi:0.07, r:95,  tx:0,  ty:0,  tz:0},
  north: {theta:Math.PI, phi:0.5, r:80, tx:0, ty:8, tz:-10},
};
function setView(k){
  const v=views[k];
  theta=v.theta; phi=v.phi; radius=v.r;
  target.set(v.tx,v.ty,v.tz);
  updateCam();
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('v-'+k)?.classList.add('active');
}

// ── ANIMATE ───────────────────────────────────────────────────────────────
(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);})();
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ── GLB MODEL — nahrazuje procedurální budovu ──────────────────────────────
// Výchozí chování: zkusí se načíst budvar_arena.glb; pokud se povede,
// procedurální budova (buildingGroup) se schová a nahradí GLB modelem.
// Pokud se GLB nenačte (chybí soubor, výpadek sítě…), procedurální
// budova zůstane viditelná — nic dalšího dělat nemusíš, funguje to samo.

const GLB_SCALE = 0.21;      // ← uprav, pokud bude model moc velký/malý
const GLB_ROTATION_Y = 0;    // ← pokud bude vchod otočený špatně, zkus Math.PI/2, Math.PI, nebo -Math.PI/2

new THREE.GLTFLoader().load(
  'budvar_arena.glb',
  (gltf) => {
    gltf.scene.scale.setScalar(GLB_SCALE);
    gltf.scene.rotation.y = GLB_ROTATION_Y;
    gltf.scene.traverse(obj => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
    scene.add(gltf.scene);
    buildingGroup.visible = false;   // schovej starou procedurální budovu
  },
  undefined,
  (err) => {
    console.warn('budvar_arena.glb se nepodařilo načíst — zůstává procedurální model.', err);
    // buildingGroup zůstává viditelná (výchozí stav), nic dalšího není potřeba.
  }
);
</script>
</body>
</html>
