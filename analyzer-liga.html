<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy – liga</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0a0b0f; --card:#10111a; --text:#ececf2;
  --mut:rgba(236,236,242,.46); --mut2:rgba(236,236,242,.26);
  --line:rgba(255,255,255,.055); --line2:rgba(255,255,255,.1);
  --hover:rgba(255,255,255,.03); --pill0:rgba(255,255,255,.055);
  --seg:rgba(255,255,255,.045); --seg-on:rgba(255,255,255,.1);
  --acc:#d2ff3c; --acc-rgb:210,255,60; --on-acc:#10130a;
  --me:#b8a6ff; --me-rgb:184,166,255;
  --neg-rgb:255,122,138; --amber:#f4c95d; --rose:#ff6b7d;
  --k1:#ff9ec7; --k2:#ffb78a; --k3:#86e3d4; --k4:#9db8ff;
  --c-wc:#ff7eb6; --c-2k:#ffd24d; --c-lv:#4fc3f7; --c-fp:#b79cff;
  --bar:rgba(255,255,255,.14); --ha:.42;
  --sans:"Inter","Geist","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#f5f5f2; --card:#ffffff; --text:#15151d;
    --mut:rgba(21,21,29,.5); --mut2:rgba(21,21,29,.28);
    --line:rgba(21,21,29,.07); --line2:rgba(21,21,29,.13);
    --hover:rgba(21,21,29,.03); --pill0:rgba(21,21,29,.05);
    --seg:rgba(21,21,29,.05); --seg-on:rgba(21,21,29,.09);
    --acc:#4f8a00; --acc-rgb:79,138,0; --on-acc:#ffffff;
    --me:#7a5cf0; --me-rgb:122,92,240;
    --neg-rgb:214,60,84; --amber:#d99a00; --rose:#d63c54;
    --k1:#d9488a; --k2:#d9703a; --k3:#139a8a; --k4:#4f6fe0;
    --c-wc:#d1318a; --c-2k:#b8860b; --c-lv:#0b84c4; --c-fp:#7a5cf0;
    --bar:rgba(21,21,29,.14); --ha:.5;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:radial-gradient(1100px 420px at 78% -8%,rgba(var(--acc-rgb),.055),transparent 62%),var(--bg);
  background-attachment:fixed;
  color:var(--text);font:13px/1.4 var(--sans);font-feature-settings:"cv11","ss01";
  -webkit-font-smoothing:antialiased;
}
button,select,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.tlum{color:var(--mut)}
b{font-weight:600}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
button:focus-visible,select:focus-visible{outline:2px solid rgba(var(--acc-rgb),.55);outline-offset:1px}

/* ---------- horní lišta ---------- */
.lista{display:flex;align-items:center;gap:18px;height:46px;padding:0 20px;position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line)}
.znacka{display:flex;align-items:center;gap:10px;font-weight:650;font-size:13px;letter-spacing:-.01em}
nav{display:flex;gap:2px;padding:3px;background:var(--seg);border-radius:10px}
nav button{border:0;background:none;padding:0 12px;height:26px;border-radius:7px;cursor:pointer;font-weight:550;color:var(--mut);transition:color .15s,background .15s}
nav button:hover{color:var(--text)}
nav button.aktivni{background:var(--seg-on);color:var(--text)}
.pribeh{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:7px;font-size:13.5px;line-height:1.5;max-width:980px}
.pribeh li{padding-left:12px;border-left:2px solid rgba(var(--acc-rgb),.45)}
.podnab{display:flex;gap:2px;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.podnab button{flex:none;border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mut);font-weight:550;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s}
.podnab button:hover{color:var(--text)}
.podnab button.aktivni{color:var(--text);border-bottom-color:var(--acc)}
.soubor{margin-left:auto;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.jiny{border:1px solid var(--line2);background:none;border-radius:8px;padding:0 12px;height:30px;cursor:pointer;color:var(--mut);white-space:nowrap;transition:color .15s,border-color .15s}
.jiny:hover{color:var(--text);border-color:var(--mut2)}
main{padding:16px 20px 32px}

/* ---------- status tečky ---------- */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;vertical-align:middle;
  background:var(--ch,var(--acc));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--ch,var(--acc)) 15%,transparent),0 0 10px color-mix(in srgb,var(--ch,var(--acc)) 60%,transparent)}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--mut2)}

/* ---------- bento ---------- */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px;margin-bottom:14px}
.card{position:relative;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;padding:13px 16px 14px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),transparent 55%),var(--card)}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}.r2{grid-row:span 2}.r3{grid-row:span 3}
@media (max-width:1000px){.c2,.c3,.c4,.c5,.c6,.c8{grid-column:span 6}.r2,.r3{grid-row:auto}}

/* ---------- vysvětlivky ---------- */
.vysv{margin:0 2px 10px;max-width:110ch}
.vysv p{margin:0;font-size:12.5px;line-height:1.5;color:var(--mut)}
.vysv .zaver{margin-top:3px;font-size:13px;color:var(--text)}
.vysv .zaver b{font-weight:650}
.sl+.vysv{margin-top:-2px}
:root[data-kontrast="1"] .vysv p{font-size:14px}
/* ---------- analytika: spravedlivé pořadí, tah kola ---------- */
.chart .dbl{stroke:var(--line2);stroke-width:2;stroke-linecap:round}
.chart .dbn{fill:var(--mut)}
.fair{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:8px}
.fair>span:first-child{min-width:34px;text-align:right}
.fair>span:last-child{min-width:26px;text-align:left;font-size:11px}
.big .zpos,.big .zneg{font-weight:inherit}

/* ---------- vzhled: hustota a projektor ---------- */
.vzhled{display:flex;gap:6px;margin-left:auto}
.soubor+.vzhled{margin-left:0}
.vzhled .jiny[aria-pressed="true"]{color:var(--text);border-color:var(--mut2);background:var(--seg-on)}
:root[data-hustota="kompakt"] body{font-size:12px}
:root[data-hustota="kompakt"] th,:root[data-hustota="kompakt"] td{padding:3px 8px}
:root[data-hustota="kompakt"] th{padding-top:5px;padding-bottom:4px}
:root[data-hustota="kompakt"] .kolo{padding:1px 3px}
:root[data-hustota="kompakt"] .v{padding:1px 6px;min-width:26px;border-radius:5px}
:root[data-hustota="kompakt"] .card{padding:10px 13px 11px}
:root[data-hustota="kompakt"] .bento{gap:8px;margin-bottom:10px}
:root[data-hustota="kompakt"] .big{font-size:28px}
:root[data-hustota="kompakt"] .big.xl{font-size:48px}
:root[data-hustota="kompakt"] .tabwrap{max-height:calc(100vh - 110px)}
:root[data-kontrast="1"]{
  --bg:#000; --card:#0a0b10; --text:#fff;
  --mut:rgba(255,255,255,.8); --mut2:rgba(255,255,255,.58);
  --line:rgba(255,255,255,.17); --line2:rgba(255,255,255,.32);
  --hover:rgba(255,255,255,.08); --pill0:rgba(255,255,255,.14);
  --seg:rgba(255,255,255,.12); --seg-on:rgba(255,255,255,.26);
  --ha:.72; --bar:rgba(255,255,255,.3);
}
@media (prefers-color-scheme:light){
  :root[data-kontrast="1"]{
    --bg:#fff; --card:#fff; --text:#000;
    --mut:rgba(0,0,0,.8); --mut2:rgba(0,0,0,.58);
    --line:rgba(0,0,0,.2); --line2:rgba(0,0,0,.42);
    --hover:rgba(0,0,0,.07); --pill0:rgba(0,0,0,.1);
    --seg:rgba(0,0,0,.09); --seg-on:rgba(0,0,0,.2);
    --acc:#3d7000; --acc-rgb:61,112,0; --ha:.8; --bar:rgba(0,0,0,.3);
  }
}
:root[data-kontrast="1"] body{font-size:15px;background-image:none}
:root[data-kontrast="1"] th{font-size:12px;font-weight:650;color:var(--text)}
:root[data-kontrast="1"] .sl,:root[data-kontrast="1"] .lab{color:var(--text);font-weight:650}
:root[data-kontrast="1"] .v{font-weight:750}
:root[data-kontrast="1"] .card,:root[data-kontrast="1"] .tabwrap,:root[data-kontrast="1"] .panel{border-color:var(--line2);background-image:none}
:root[data-kontrast="1"] .chart text{font-size:12px;fill:var(--mut)}
:root[data-kontrast="1"] .chart path[stroke-width]{stroke-width:3px}
:root[data-kontrast="1"] .bump .ln{stroke-width:2.4}
:root[data-kontrast="1"] .chart .gl{stroke:var(--line2)}
:root[data-kontrast="1"] .od{width:11px;height:11px}
:root[data-kontrast="1"] .cip{font-size:11px}
@media (max-width:640px){.vzhled{order:2}}
@media (max-width:640px){.c4,.c5,.c6,.c8{grid-column:span 12}.c2,.c3{grid-column:span 6}main{padding:12px 12px 40px}
  .lista{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}.soubor{display:none}
  .znacka{flex:1 0 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{order:3;width:100%;overflow-x:auto}nav button{flex:none}
  .cw svg.chart{min-width:540px}.cw svg.bump{min-width:640px}
  .big{font-size:30px}.big.xl{font-size:44px}
  .tabwrap{max-height:none}
  .mat .p0{width:32px;min-width:32px}.mat .p1{left:32px;width:104px;min-width:104px}.jm{max-width:96px}
  .mat .s1{width:116px;min-width:116px}.mat .s2,.mat .s3{display:none}.mat.tm td.kolo,.mat.tm th.rk{width:70px;min-width:70px}}

.lab{font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kpi{display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.big{font-size:34px;line-height:.95;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.big.xl{font-size:58px;letter-spacing:-.055em;line-height:.9}
.big .of{font-size:.42em;font-weight:600;letter-spacing:-.02em;color:var(--mut);margin-left:.18em}
.sub{margin-top:6px;font-size:12px;color:var(--mut)}
.sub+.sub{margin-top:3px}
.sub b{color:var(--text)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.lg{display:inline-flex;align-items:center;gap:7px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.cw{overflow-x:auto;overflow-y:hidden;margin:0 -4px;padding:0 4px}
.chart text{font:10px var(--sans);fill:var(--mut2);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--line);stroke-width:1}
.pt .d{opacity:0;transition:opacity .12s}
.pt:hover .d{opacity:1}
.bar .hit{fill:transparent}
.bar:hover .hit{fill:var(--hover)}
.bar .seg{transition:opacity .12s}
.bar:hover .seg{opacity:.78}
.chart .mk{stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.slr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.slr .sl{margin:0 0 0 2px}
.skl{display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.skl>i:not(.od){display:block;width:110px;height:8px;border-radius:4px;background:var(--g)}
.skl .od{position:static}
.sl{margin:0 0 6px 2px;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.bc{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.bc b{min-width:26px;text-align:right}
.bc .tr{display:inline-block;width:110px;height:6px;border-radius:3px;background:var(--pill0);overflow:hidden}
.bc .fl{display:block;height:100%;border-radius:3px;background:rgba(var(--acc-rgb),.7)}
.chipl{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.chipl>div{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.chipl>div:last-child{border-bottom:0}
.chipl .nm{flex:1;color:var(--text)}
.chipl .kl{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- ovládací prvky ---------- */
.hlava{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap}
select{height:32px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:0 10px;min-width:200px;cursor:pointer}
.jmeno{font-size:15px;font-weight:650;letter-spacing:-.01em}
.kolacip{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px;align-items:center}
.kolacip .stit{font-size:11px;color:var(--mut);margin-right:8px;text-transform:uppercase;letter-spacing:.05em}
.kolacip button{min-width:32px;height:26px;border:1px solid var(--line);background:none;border-radius:8px;cursor:pointer;color:var(--mut);font-variant-numeric:tabular-nums;transition:color .12s,border-color .12s}
.kolacip button:hover{color:var(--text);border-color:var(--line2)}
.kolacip button.aktivni{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}

/* ---------- tabulky ---------- */
.tabwrap,.panel{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.tabwrap{max-height:calc(100vh - 130px);min-height:260px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.panel table{width:100%}
th,td{padding:6px 10px;white-space:nowrap;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:var(--card);border-bottom:1px solid var(--line2);padding-top:8px;padding-bottom:7px}
tbody tr:last-child td{border-bottom:0}
.n{text-align:right}
tbody tr:hover td{background-image:linear-gradient(var(--hover),var(--hover))}
tr.top td{background-image:linear-gradient(rgba(var(--acc-rgb),.055),rgba(var(--acc-rgb),.055))}
tr.top td:first-child{box-shadow:inset 2px 0 0 var(--acc)}
tr.bad td{background-image:linear-gradient(rgba(var(--neg-rgb),.06),rgba(var(--neg-rgb),.06))}
tr.bad td:first-child{box-shadow:inset 2px 0 0 rgb(var(--neg-rgb))}
tr.dim td{color:var(--mut)}
tr.dim .v{opacity:.45}
.dotc{width:22px;padding-right:0!important}
.gA{color:var(--acc)}
.aA{color:var(--k3)}
.kk{display:inline-flex;gap:1px}
.tier{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.sekce{margin-bottom:14px}
.sekce>h3{margin:0 0 6px 2px;font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}

.mat{width:max-content;min-width:100%}
.mat th{position:sticky;top:0;z-index:2}
.mat .s1,.mat .s2,.mat .s3{position:sticky;background-color:var(--card);z-index:1}
.mat th.s1,.mat th.s2,.mat th.s3{z-index:3}
.mat .p0,.mat .p1{position:sticky;background-color:var(--card);z-index:1}
.mat th.p0,.mat th.p1{z-index:3}
.mat .p0{left:0;width:40px;min-width:40px}
.mat .p1{left:40px;width:170px;min-width:170px}
.mat .s1{left:0;width:170px;min-width:170px}
.mat .s2{left:170px;width:62px;min-width:62px}
.mat .s3{left:232px;width:46px;min-width:46px}
.jm{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.kolo{padding:3px 4px;text-align:right;min-width:56px}
.mat.tm td.kolo,.mat.tm th.rk{width:78px;min-width:78px}
.cell{display:inline-flex;align-items:center;justify-content:flex-end;gap:5px}
.v{display:inline-block;min-width:28px;padding:2px 7px;border-radius:6px;text-align:center;font-weight:600;background:var(--pill0)}
.v{position:relative}
.odz{position:absolute;top:-5px;right:-5px;display:flex;gap:2px}
.od{display:block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--ch);
  box-shadow:0 0 0 1.5px var(--card),0 0 8px color-mix(in srgb,var(--ch) 55%,transparent)}
.od.odhad{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ch),0 0 0 1.5px var(--card)}
.v.h{background:rgba(var(--c),var(--ha))}
.v.neg{background:rgba(var(--neg-rgb),.3)}
.v.best{box-shadow:inset 0 0 0 1px rgba(var(--acc-rgb),.85)}
.v.nehral{color:var(--mut)}
.v.lav{background:transparent;color:var(--mut);box-shadow:inset 0 0 0 1px var(--line2);font-weight:500}
.nic{color:var(--mut2)}
.kap{font-size:9px;font-weight:600;color:var(--mut)}
.sum{font-weight:700;background-color:rgba(128,128,140,.05)}
.mat .s1.sum{background-color:var(--card)}
tfoot td{position:sticky;bottom:0;background-color:var(--card);border-top:1px solid var(--line2);border-bottom:0;font-weight:600;color:var(--mut)}
tfoot td.sum{color:var(--text)}
.nesedi{color:rgb(var(--neg-rgb))!important}
.m{display:inline-flex;align-items:center;margin-left:1px}
.m .g{font-size:8px;letter-spacing:-1px;margin-right:2px;color:var(--acc)}
.m .a{font-size:8px;letter-spacing:-1px;margin-right:2px;color:var(--mut)}
.zk,.ck{display:inline-block;width:5px;height:9px;margin-left:2px;border-radius:1.5px}
.zk{background:var(--amber);box-shadow:0 0 6px color-mix(in srgb,var(--amber) 60%,transparent)}
.ck{background:var(--rose);box-shadow:0 0 6px color-mix(in srgb,var(--rose) 60%,transparent)}

.cip{display:inline-block;padding:1px 5px;font-size:9px;font-weight:700;letter-spacing:.03em;border-radius:5px;line-height:1.5;
  color:var(--ch);background:color-mix(in srgb,var(--ch) 13%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ch) 32%,transparent)}
.cip.odhad{background:transparent;opacity:.8;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ch) 45%,transparent)}
.cnm{display:inline-flex;align-items:center;gap:9px}
.pozn{margin:-4px 2px 12px;font-size:12px;color:var(--mut)}

/* ---------- analytika ---------- */
.zpos{color:var(--acc);font-weight:600}
.zneg{color:rgb(var(--neg-rgb));font-weight:600}
.lnk{font-weight:600;cursor:pointer}
.lnk:hover{text-decoration:underline;text-decoration-color:var(--mut2);text-underline-offset:3px}
.seg2{display:inline-flex;gap:2px;padding:2px;background:var(--seg);border-radius:8px}
.seg2 button{border:0;background:none;padding:0 10px;height:22px;border-radius:6px;cursor:pointer;color:var(--mut);font-size:11px;font-weight:550;white-space:nowrap}
.seg2 button:hover{color:var(--text)}
.seg2 button.aktivni{background:var(--seg-on);color:var(--text)}
.bump .ln{fill:none;stroke:var(--mut2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .12s}
.bump .pn{fill:var(--mut2)}
.bump .nm{fill:var(--mut)}
.bump .tm:hover .ln{stroke:var(--acc);stroke-width:2.6}
.bump .tm:hover .pn{fill:var(--acc)}
.bump .tm:hover .nm{fill:var(--text);font-weight:600}
.bump:has(.tm:hover) .tm:not(:hover){opacity:.25}
.chart .gl0{stroke:var(--mut2);stroke-width:1;stroke-dasharray:3 3}
.chart .zona{fill:rgba(var(--acc-rgb),.06);stroke:rgba(var(--acc-rgb),.4);stroke-dasharray:3 3}
.sc{cursor:pointer}
.sc:hover{opacity:1!important;stroke:var(--text);stroke-width:1}
.tabwrap th{position:sticky;top:0;z-index:2}
.tabwrap table:not(.mat){width:100%}
th[data-k]{cursor:pointer;user-select:none;transition:color .12s}
th[data-k]:hover,th.sorted{color:var(--text)}
th .ar{color:var(--acc);font-size:9px;margin-left:3px}
.hlava .jiny{height:28px}
.tier select{min-width:0;height:26px;font-size:11px;padding:0 8px}

/* ---------- úvodní obrazovka ---------- */
#prazdny{min-height:100vh;display:grid;place-items:center}

    <span class="vzhled"><button class="jiny" id="bHust" type="button" aria-pressed="false">Kompaktní</button><button class="jiny" id="bKon" type="button" aria-pressed="false">Projektor</button></span>
    <button class="jiny" id="jiny" type="button">Načíst jiný soubor</button>
  </header>
  <main id="obsah"></main>

<input type="file" id="vstup" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
const POZ={Goalkeeper:'BR',Defender:'OB',Midfielder:'ZÁ',Attacker:'ÚT'};
const ZALOZKY=[['prehled','Přehled'],['poradi','Pořadí'],['tym','Tým'],['kolo','Kolo'],['hraci','Hráči'],['souboj','Souboj'],['rozhodnuti','Rozhodnutí'],['data','Data']];
const CIPY=[
  ['wildcard','PK','Přestavba kádru','var(--c-wc)'],
  ['two_captains','SD','Super duo','var(--c-2k)'],
  ['benchboost','HL','Hrdinové lavičky','var(--c-lv)'],
  ['financial_takeover','BM','Bohatý majitel','var(--c-fp)']];

let D=null;
const UI={zalozka:'prehled',sub:{poradi:'poradi',kolo:'rozbor',hraci:'hraci',souboj:'souboj',rozhodnuti:'spravedlive'},tym:null,kolo:null,hrac:null,souA:null,souB:null,souKolo:'all',rezim:'body',hFiltr:{poz:'',klub:''},
  trP:{klic:'soucet',smer:-1},trT:{klic:'soucet',smer:-1},trH:{klic:'body',smer:-1},trS:{klic:'d',smer:-1},
  trK:{klic:'bonus',smer:-1},trL:{klic:'lavNev',smer:-1},trC:{klic:'kolo',smer:1},trF:{klic:'skut',smer:-1},prest:'vse',trPr:{klic:'cisty',smer:-1},trPT:{klic:'k',smer:1},trPo:{klic:'avg',smer:-1},trPod:{klic:'prum',smer:-1},trCI:{klic:'ztr',smer:-1},trSt:{klic:'sd',smer:1},trD:{klic:'zisk',smer:-1}};

const $=s=>document.querySelector(s);
const el=(t,c,...k)=>{const e=document.createElement(t);if(c)e.className=c;for(const x of k){if(x==null||x===false)continue;e.append(x.nodeType?x:String(x))}return e};
const NS='http://www.w3.org/2000/svg';
const sv=(t,a,...k)=>{const e=document.createElementNS(NS,t);for(const[x,y]of Object.entries(a||{}))e.setAttribute(x,y);for(const c of k)if(c!=null)e.append(c);return e};
const cs=new Intl.Collator('cs');
const f1=n=>n.toLocaleString('cs-CZ',{minimumFractionDigits:1,maximumFractionDigits:1});
const kz=id=>D.kluby.get(id)?.zkratka||'?';
const jm=id=>{const h=D.hraci.get(id);if(!h)return '#'+id;
  const ini=String(h.jmeno||'').split(/\s+/).filter(Boolean).map(x=>x[0]+'.').join(' ');return `${h.prijmeni} ${ini}`.trim()};
const soup=r=>`${kz(r.soupernikId)} (${r.doma?'D':'V'})`;
const STOPS=[[0,[122,92,240]],[.28,[84,140,240]],[.55,[47,196,178]],[.78,[143,224,90]],[1,[210,255,60]]];
const barvaT=x=>{
  for(let i=1;i<STOPS.length;i++)if(x<=STOPS[i][0]){
    const a=STOPS[i-1],b=STOPS[i],f=(x-a[0])/(b[0]-a[0]);
    return a[1].map((c,k)=>Math.round(c+(b[1][k]-c)*f));
  }
  return STOPS[STOPS.length-1][1];
};
const skala=vals=>{const v=vals.filter(x=>x!=null&&x>0).sort((a,b)=>a-b);return{v,lo:v[0],hi:v[v.length-1]}};
function teplo(b,sc){
  if(b<0)return 'neg';
  if(!(b>0)||!sc.v.length)return '';
  const lin=sc.hi>sc.lo?(b-sc.lo)/(sc.hi-sc.lo):1;
  let lt=0,eq=0;for(const x of sc.v){if(x<b)lt++;else if(x===b)eq++}
  const pct=(lt+eq/2)/sc.v.length;
  const c=barvaT(Math.min(1,Math.max(0,.5*lin+.5*pct)));
  return c.join(',');
}
const legendaSkaly=(lg=['méně','více'])=>{const g=el('i');
  g.style.setProperty('--g','linear-gradient(90deg,'+STOPS.map(([p,c])=>`rgba(${c.join(',')},var(--ha)) ${p*100}%`).join(',')+')');
  return el('span','skl',lg[0],g,lg[1])};
const popisek=(txt,extra,ctrl,lg)=>el('div','slr',el('h3','sl',txt),el('span','tier',...(ctrl?[ctrl]:[]),...(extra||[]),legendaSkaly(lg)));
const odznak=(def,odhad)=>{const s=el('i','od'+(odhad?' odhad':''));s.style.setProperty('--ch',def[3]);
  s.title=def[2]+(odhad?' (odhad z dat)':'');return s};
const vyp=n=>n||'';
const B=t=>el('b',null,t);
const dot=(c,off)=>{const s=el('i','dot'+(off?' off':''));if(c)s.style.setProperty('--ch',c);return s};
const sumA=a=>a.reduce((x,y)=>x+y,0);

/* ---------- příprava dat ---------- */
function pripravit(raw){
  if(!raw||!Array.isArray(raw.ucastnici)||!Array.isArray(raw.tymKolo)||!Array.isArray(raw.sestavy))
    throw new Error('Soubor nemá očekávanou strukturu (chybí „ucastnici“, „tymKolo“ nebo „sestavy“). Je to soubor z extraktoru ligy?');
  const kluby=new Map((raw.kluby||[]).map(k=>[k.id,k]));
  const hraci=new Map((raw.hraci||[]).map(h=>[h.id,h]));
  const hk=new Map();
  for(const r of raw.radky||[]){
    const k=r.hracId+'|'+r.kolo;let o=hk.get(k);
    if(!o){o={body:0,min:0,goly:0,asist:0,zlute:0,cervene:0,zapasy:[]};hk.set(k,o)}
    o.body+=r.body;o.min+=r.min;o.goly+=r.goly;o.asist+=r.asist;o.zlute+=r.zlute;o.cervene+=r.cervene;o.zapasy.push(r);
  }
  const ceny=new Map();let cenaMax=0;
  for(const c of raw.ceny||[]){
    if(c.cena==null||!isFinite(c.cena))continue;
    let m=ceny.get(c.hracId);if(!m){m=new Map();ceny.set(c.hracId,m)}
    m.set(c.kolo,c.cena);if(c.cena>cenaMax)cenaMax=c.cena;
  }
  const tymy=new Map(raw.ucastnici.map(u=>[u.tymId,{...u,kola:new Map(),sestava:new Map(),soucet:0,prumer:0}]));
  for(const t of raw.tymKolo){const u=tymy.get(t.tymId);if(u)u.kola.set(t.kolo,t)}
  for(const s of raw.sestavy){
    const u=tymy.get(s.tymId);if(!u)continue;
    let a=u.sestava.get(s.kolo);if(!a){a=[];u.sestava.set(s.kolo,a)}
    a.push(s);
  }
  for(const u of tymy.values()){
    let n=0;
    for(const t of u.kola.values())if(t.body!=null){u.soucet+=t.body;n++}
    u.prumer=n?u.soucet/n:0;
    for(const a of u.sestava.values())a.sort((x,y)=>(x.slot==='Bench')-(y.slot==='Bench')||x.poradi-y.poradi);
  }
  const cipRaw=new Map((raw.cipy||[]).map(c=>[c.tymId,c]));
  for(const u of tymy.values()){
    const c=cipRaw.get(u.tymId),o={};
    for(const[id]of CIPY)o[id]=c&&id in c?{kolo:c[id],odhad:false}:{kolo:null,odhad:false,bezDat:!c};
    if(!c){
      const lv=[...u.kola.values()].filter(t=>t.lavicka).map(t=>t.kolo).sort((a,b)=>a-b)[0];
      if(lv!=null)o.benchboost={kolo:lv,odhad:true};
      for(const[kolo,arr]of [...u.sestava].sort((a,b)=>a[0]-b[0]))
        if(arr.filter(s=>s.kapitan&&s.slot!=='Bench').length>=2){o.two_captains={kolo,odhad:true};break}
    }
    u.cipy=o;
  }
  const kola=[...new Set(raw.tymKolo.map(t=>t.kolo))].sort((a,b)=>a-b);
  return{meta:raw.meta||{},tymy,hraci,kluby,hk,kola,ceny,maCeny:ceny.size>0,cenaJ:cenaMax>=1e6?1e6:1};
}
/* ceny: jednotka se pozná z dat (miliony se zkrátí na „M“) */
const fc=v=>{if(v==null)return '';const x=v/D.cenaJ;return x.toLocaleString('cs-CZ',{minimumFractionDigits:D.cenaJ>1||Math.abs(x)<100?2:0,maximumFractionDigits:2})};
const fcu=v=>v==null?'':fc(v)+(D.cenaJ>1?' M':'');
const zc=d=>{const a=Math.abs(d)/D.cenaJ,p=d/D.cenaJ>=.005,m=d/D.cenaJ<=-.005;
  return el('span',p?'zpos':m?'zneg':'tlum',(p?'+':m?'−':'')+(p||m?a.toLocaleString('cs-CZ',{minimumFractionDigits:D.cenaJ>1||a<100?2:0,maximumFractionDigits:2})+(D.cenaJ>1?' M':''):'0'))};
function hodnotaSestavy(u,k){
  const a=u.sestava.get(k);if(!a||!a.length)return null;
  let t=0;for(const x of a){const m=D.ceny.get(x.hracId),c=m&&m.get(k);if(c==null)return null;t+=c}
  return t;
}
const vHre=(u,kolo,s)=>s.slot!=='Bench'||!!(u.kola.get(kolo)&&u.kola.get(kolo).lavicka);
const bodyKola=(u,k)=>{const t=u&&u.kola.get(k);return t&&t.body!=null?t.body:null};
const rozsahKola=k=>{const v=[...D.tymy.values()].map(u=>bodyKola(u,k)).filter(x=>x!=null);return v.length?[Math.min(...v),Math.max(...v)]:[null,null]};
const prumerKola=k=>{const v=[...D.tymy.values()].map(u=>bodyKola(u,k)).filter(x=>x!=null);return v.length?sumA(v)/v.length:null};

const serLiga=()=>[
  {name:'Nejlepší tým v kole',vals:D.kola.map(k=>rozsahKola(k)[1]),color:'var(--text)',w:1.5},
  {name:'Ø liga',vals:D.kola.map(prumerKola),color:'var(--acc)',fill:true,w:2.2},
  {name:'Nejhorší tým v kole',vals:D.kola.map(k=>rozsahKola(k)[0]),color:'var(--mut)',w:1.5}];
const legLiga=[['var(--text)','Nejlepší tým v kole'],['var(--acc)','Průměr ligy'],['var(--mut)','Nejhorší tým v kole']];

/* ---------- grafy (SVG) ---------- */
let gid=0;
const clamp=(v,a,b)=>Math.min(Math.max(a,b),Math.max(Math.min(a,b),v));
function osaY(lo,hi,n){const t=[];for(let i=0;i<=n;i++)t.push(lo+(hi-lo)*i/n);return t}
/* hezká osa: kulaté kroky (1, 2, 5 × 10ⁿ); celá čísla, když o to jde */
function niceAxis(lo,hi,celoc){
  if(!(hi>lo))hi=lo+1;
  let raw=(hi-lo)/4;
  if(celoc)raw=Math.max(1,raw);
  const mag=Math.pow(10,Math.floor(Math.log10(raw))),nrm=raw/mag;
  let st=(nrm<=1.25?1:nrm<=2.5?2:nrm<=6?5:10)*mag;
  if(celoc)st=Math.max(1,Math.round(st));
  const a=Math.floor(lo/st+1e-9)*st,b=Math.ceil(hi/st-1e-9)*st,t=[];
  for(let v=a;v<=b+st/2;v+=st)t.push(Math.round(v*1e6)/1e6);
  return{lo:a,hi:b,ticks:t};
}
function krivka(p){
  let d=`M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for(let i=0;i<p.length-1;i++){
    const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c;
    const y1=clamp(b[1]+(c[1]-a[1])/6,b[1],c[1]),y2=clamp(c[1]-(e[1]-b[1])/6,b[1],c[1]);
    d+=`C${(b[0]+(c[0]-a[0])/6).toFixed(1)} ${y1.toFixed(1)} ${(c[0]-(e[0]-b[0])/6).toFixed(1)} ${y2.toFixed(1)} ${c[0].toFixed(1)} ${c[1].toFixed(1)}`;
  }
  return d;
}
const mrizka=(svg,lo,hi,L,W,R,Y,fmt,ticks)=>{
  for(const v of (ticks||osaY(lo,hi,4))){
    const y=Y(v);
    svg.append(sv('line',{class:'gl',x1:L,x2:W-R,y1:y,y2:y}),
      sv('text',{x:L-8,y:y+3.5,'text-anchor':'end'},fmt(v)));
  }
};
const popisky=(svg,labels,X,H,B)=>{
  labels.forEach((l,i)=>svg.append(sv('text',{x:X(i),y:H-B+18,'text-anchor':'middle'},l)));
};

/* series: [{name,vals,color,fill,dash,w}] */
function lineChart(labels,series,fmt,o={}){
  const W=o.W||640,H=o.H||190,L=o.L||34,R=14,T=14,Bt=28,n=labels.length;
  const vals=series.flatMap(s=>s.vals).filter(v=>v!=null);
  if(!vals.length)return el('div','tlum','Žádná data.');
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi===lo){hi+=1;lo-=1}
  const pad=(hi-lo)*.12;hi+=pad;lo=lo>=0?Math.max(0,lo-pad):lo-pad;
  const ax=niceAxis(lo,hi,!o.real);lo=ax.lo;hi=ax.hi;
  const X=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1)),Y=v=>T+(H-T-Bt)*(1-(v-lo)/(hi-lo)),base=H-Bt;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img'});
  const defs=sv('defs');svg.append(defs);
  mrizka(svg,lo,hi,L,W,R,Y,o.real?(o.osa||fmt):(v=>String(Math.round(v))),ax.ticks);
  popisky(svg,labels,X,H,Bt);
  if(o.zero&&lo<0&&hi>0)svg.append(sv('line',{class:'gl0',x1:L,x2:W-R,y1:Y(0),y2:Y(0)}));
  if(o.mark!=null){const i=labels.indexOf(String(o.mark));if(i>=0)svg.append(sv('line',{class:'mk',x1:X(i),x2:X(i),y1:T,y2:base}))}
  for(const s of series){
    const runs=[];let cur=[];
    s.vals.forEach((v,i)=>{if(v==null){if(cur.length)runs.push(cur);cur=[]}else cur.push([X(i),Y(v),i,v])});
    if(cur.length)runs.push(cur);
    let gradId=null;
    if(s.fill){
      gradId='lg'+(++gid);
      defs.append(sv('linearGradient',{id:gradId,x1:0,y1:0,x2:0,y2:1},
        sv('stop',{offset:'0%',style:`stop-color:${s.color};stop-opacity:.34`}),
        sv('stop',{offset:'100%',style:`stop-color:${s.color};stop-opacity:0`})));
    }
    for(const r of runs){
      if(r.length<2)continue;
      const d=krivka(r);
      if(s.fill)svg.append(sv('path',{d:`${d}L${r[r.length-1][0].toFixed(1)} ${base}L${r[0][0].toFixed(1)} ${base}Z`,style:`fill:url(#${gradId})`}));
      svg.append(sv('path',{d,fill:'none','stroke-linecap':'round','stroke-linejoin':'round','stroke-width':s.w||2,
        'stroke-dasharray':s.dash?'3 5':'none',style:`stroke:${s.color}`}));
    }
    const all=runs.flat();
    for(const p of all){
      svg.append(sv('g',{class:'pt'},
        sv('title',null,`Kolo ${labels[p[2]]} · ${s.name}: ${fmt(p[3])}`),
        sv('circle',{cx:p[0],cy:p[1],r:10,style:'fill:transparent'}),
        sv('circle',{class:'d',cx:p[0],cy:p[1],r:3.5,style:`fill:${s.color}`})));
    }
    const last=all[all.length-1];
    if(last&&!s.dash)svg.append(sv('circle',{cx:last[0],cy:last[1],r:8,style:`fill:${s.color};opacity:.17`,'pointer-events':'none'}),
      sv('circle',{cx:last[0],cy:last[1],r:3.5,style:`fill:${s.color}`,'pointer-events':'none'}));
  }
  return svg;
}

/* items: [{label,title,segs:[{v,color}]}] */
function barChart(items,o={}){
  const W=o.W||640,H=o.H||175,L=34,R=14,T=14,Bt=28,n=items.length;
  if(!n)return el('div','tlum','Žádná data.');
  const tot=i=>sumA(i.segs.map(s=>s.v));
  const axb=niceAxis(0,Math.max(...items.map(tot),1),true);const hi=axb.hi;
  const Y=v=>T+(H-T-Bt)*(1-v/hi),base=H-Bt,band=(W-L-R)/n,bw=Math.min(30,band*.64);
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img'});
  mrizka(svg,0,hi,L,W,R,Y,v=>String(Math.round(v)),axb.ticks);
  items.forEach((it,i)=>{
    const g=sv('g',{class:'bar'},sv('title',null,it.title||it.label),
      sv('rect',{class:'hit',x:L+band*i,y:T,width:band,height:H-T-Bt,rx:6}));
    let y=base;const x=L+band*i+(band-bw)/2;
    for(const s of it.segs){
      const h=Math.max(0,s.v/hi*(H-T-Bt));if(!h)continue;
      y-=h;
      g.append(sv('rect',{class:'seg',x:x.toFixed(1),y:y.toFixed(1),width:bw.toFixed(1),height:h.toFixed(1),rx:3,
        style:`fill:${s.color}`+(it.segs.length>1?';stroke:var(--card);stroke-width:1':'')}));
    }
    svg.append(g);
    svg.append(sv('text',{x:L+band*i+band/2,y:H-Bt+18,'text-anchor':'middle'},it.label));
  });
  return svg;
}

/* ---------- karty ---------- */
const karta=(cls,lab,val,sub)=>el('div','card kpi '+cls,el('div','lab',lab),
  el('div',null,el('div','big'+(cls.includes('hero')?' xl':''),val),
    ...(sub||[]).map(l=>el('div','sub',...[].concat(l)))));
const grafKarta=(cls,lab,legend,body)=>el('div','card '+cls,
  el('div','chead',el('div','lab',lab),el('div','legend',...legend.map(([c,n])=>el('span','lg',dot(c),n)))),el('div','cw',body));
const bento=(...k)=>el('div','bento',...k);

/* ---------- pomocné prvky ---------- */
const cipZnacka=(def,odhad)=>{const s=el('span','cip'+(odhad?' odhad':''),def[1]);s.style.setProperty('--ch',def[3]);
  s.title=def[2]+(odhad?' (odhad z dat)':'');return s};
const cipText=c=>c.kolo!=null?`K${c.kolo}${c.odhad?' ~':''}`:(c.bezDat?'?':'–');
function znacky(k){
  const s=el('span','m');
  if(k.goly)s.append(el('span','g','●'.repeat(Math.min(k.goly,6))));
  if(k.asist)s.append(el('span','a','○'.repeat(Math.min(k.asist,6))));
  for(let i=0;i<k.zlute;i++)s.append(el('i','zk'));
  for(let i=0;i<k.cervene;i++)s.append(el('i','ck'));
  return s;
}
function tb(cols,rows){
  const t=el('table'),hr=el('tr');
  for(const c of cols)hr.append(el('th',c.c,c.h));
  t.append(el('thead',null,hr));
  const b=el('tbody');
  rows.forEach((r,i)=>{
    const tr=el('tr',r&&r.__cls);
    for(const c of cols){
      const td=el('td',c.c),v=c.f(r,i);
      if(v!=null&&v!=='')td.append(v.nodeType?v:String(v));
      tr.append(td);
    }
    b.append(tr);
  });
  t.append(b);
  return el('div','panel',t);
}
const podnab=(tab,polozky)=>el('div','podnab',...polozky.map(([k,t])=>{
  const b=el('button',UI.sub[tab]===k?'aktivni':'',t);b.onclick=()=>{UI.sub[tab]=k;kresliVse()};return b}));
const sekce=(t,x)=>el('div','sekce',el('h3',null,t),x);
/* vysvětlení běžným jazykem + automatický závěr z dat */
const vysv=(txt,zaver)=>el('div','vysv',el('p',null,txt),zaver?el('p','zaver',...[].concat(zaver).flat(Infinity)):null);
const ASC=new Set(['jmeno','tym','klub','poz','kat','cip','oprum','onej']);
function mkTh(txt,klic,cls,st,rer,title,asc){
  const t=el('th',(cls||'')+(st.klic===klic?' sorted':''),txt);if(title)t.title=title;t.dataset.k=klic;
  if(st.klic===klic)t.append(el('span','ar',st.smer>0?'▲':'▼'));
  t.onclick=()=>{
    if(st.klic===klic)st.smer*=-1;
    else{st.klic=klic;st.smer=(asc||ASC.has(klic))?1:-1}
    rer();
  };
  return t;
}
function trid(list,st,hod,zaloha){
  list.sort((a,b)=>{
    const x=hod(a,st.klic),y=hod(b,st.klic);
    if(x==null&&y==null)return zaloha(a,b);
    if(x==null)return 1;if(y==null)return -1;
    const c=typeof x==='string'?cs.compare(x,y):x-y;
    return c?c*st.smer:zaloha(a,b);
  });
}
function barCell(v,mx){
  const f=el('i','fl');f.style.width=(mx>0?Math.max(0,v)/mx*100:0)+'%';
  return el('span','bc',el('b',null,v),el('i','tr',f));
}
function bunka(body,sc,cls){
  const v=el('span','v'+(cls?' '+cls:''),body);
  const h=teplo(body,sc);
  if(h==='neg')v.classList.add('neg');else if(h){v.classList.add('h');v.style.setProperty('--c',h)}
  return v;
}

const fb=n=>{n=Math.round(n*10)/10;return Number.isInteger(n)?String(n):f1(n)};
const znam=(n,jednoDes)=>{
  const a=Math.abs(Math.round(n*10)/10),p=n>0.05,m=n<-0.05;
  return el('span',p?'zpos':m?'zneg':'tlum',(p?'+':m?'−':'')+(jednoDes?f1(a):fb(a)));
};
const percentil=(arr,p)=>{if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);return s[Math.floor(p*(s.length-1))]};
const prepinac=(opts,cur,fn)=>el('div','seg2',...opts.map(([k,t])=>{
  const b=el('button',k===cur?'aktivni':'',t);b.onclick=()=>fn(k);return b}));
const hracLink=id=>{
  const s=el('span','lnk',jm(id)),h=D.hraci.get(id)||{};
  s.title=`${h.jmeno||''} ${h.prijmeni||''}`.trim();
  s.onclick=()=>{UI.hrac=id;UI.zalozka='hraci';kresliVse()};
  return s;
};
const skalaVse=vals=>{const v=vals.filter(x=>x!=null).sort((a,b)=>a-b);return{v,lo:v[0],hi:v[v.length-1]}};
function teploT(b,sc,inv){
  if(b==null||!sc.v.length)return '';
  const lin=sc.hi>sc.lo?(b-sc.lo)/(sc.hi-sc.lo):.5;
  let lt=0,eq=0;for(const x of sc.v){if(x<b)lt++;else if(x===b)eq++}
  let t=.5*lin+.5*(lt+eq/2)/sc.v.length;if(inv)t=1-t;
  return barvaT(Math.min(1,Math.max(0,t))).join(',');
}
function pilulka(text,c,cls){
  const v=el('span','v'+(cls?' '+cls:''),text);
  if(c){v.classList.add('h');v.style.setProperty('--c',c)}
  return v;
}

/* sortovatelná tabulka: cols [{k,h,c,f(r,i),v(r),title}] */
function sortTb(cols,rows,st,o={}){
  const box=el('div',o.cls||'panel');
  function kresli(){
    const list=[...rows];
    trid(list,st,(r,k)=>{const c=cols.find(x=>x.k===k);return c&&c.v?c.v(r):null},o.zaloha||(()=>0));
    const t=el('table'),hr=el('tr');
    for(const c of cols)hr.append(c.k?mkTh(c.h,c.k,c.c||'',st,kresli,c.title):el('th',c.c,c.h));
    t.append(el('thead',null,hr));
    const b=el('tbody');
    list.forEach((r,i)=>{
      const tr=el('tr',r&&r.__cls);
      for(const c of cols){const td=el('td',c.c),v=c.f(r,i);if(v!=null&&v!=='')td.append(v.nodeType?v:String(v));tr.append(td)}
      b.append(tr);
    });
    t.append(b);box.replaceChildren(t);
  }
  kresli();
  return box;
}

/* pořadí po kolech (kumulativní body) a pořadí v jednotlivých kolech */
function poradiKum(){
  const tymy=[...D.tymy.values()],cum=new Map(tymy.map(u=>[u.tymId,0])),out=new Map(tymy.map(u=>[u.tymId,[]]));
  for(const k of D.kola){
    for(const u of tymy)cum.set(u.tymId,cum.get(u.tymId)+(bodyKola(u,k)||0));
    const s=[...tymy].sort((a,b)=>cum.get(b.tymId)-cum.get(a.tymId)||cs.compare(a.jmeno,b.jmeno));
    let prev=null,pos=0;
    s.forEach((u,i)=>{const v=cum.get(u.tymId);if(v!==prev){pos=i+1;prev=v}out.get(u.tymId).push({r:pos,s:v})});
  }
  return out;
}
const pk=()=>D.pk||(D.pk=poradiKum());
function poradiKola(k){
  D.pkola=D.pkola||new Map();
  if(D.pkola.has(k))return D.pkola.get(k);
  const l=[...D.tymy.values()].filter(u=>bodyKola(u,k)!=null).sort((a,b)=>bodyKola(b,k)-bodyKola(a,k)||cs.compare(a.jmeno,b.jmeno));
  const m=new Map();let prev=null,pos=0;
  l.forEach((u,i)=>{const v=bodyKola(u,k);if(v!==prev){pos=i+1;prev=v}m.set(u.tymId,pos)});
  D.pkola.set(k,m);return m;
}

/* kapitáni a lavička v jednom kole jednoho týmu */
/* kdo má v kole zdvojené body: nominovaný kapitán, který hrál; když nenastoupil, jeho roli přebírá zástupce */
function kapEf(u,k){
  D.kef=D.kef||new Map();
  const key=u.tymId+'|'+k;
  if(D.kef.has(key))return D.kef.get(key);
  const all=u.sestava.get(k)||[];
  const hrala=s=>{const e=D.hk.get(s.hracId+'|'+k);return e?e.min>0:s.body!==0};
  const dbl=s=>{const e=D.hk.get(s.hracId+'|'+k);return !!e&&e.body!==0&&s.body===2*e.body};
  const nom=all.filter(s=>s.kapitan);
  const res=nom.filter(s=>vHre(u,k,s)&&(hrala(s)||dbl(s)));
  let need=nom.length-res.length;
  for(const v of all.filter(s=>s.vicekapitan&&!s.kapitan&&vHre(u,k,s))){
    if(need<=0)break;
    if(hrala(v)||dbl(v)){res.push(v);need--}
  }
  D.kef.set(key,res);
  return res;
}
const jeKap=(u,k,s)=>kapEf(u,k).includes(s);
function analyzaTK(u,k){
  D.an=D.an||new Map();
  const key=u.tymId+'|'+k;
  if(D.an.has(key))return D.an.get(key);
  const arr=u.sestava.get(k)||[],tk=u.kola.get(k),lav=!!(tk&&tk.lavicka);
  const ef=kapEf(u,k),nomN=arr.filter(s=>s.kapitan).length;
  const rawOf=s=>{const e=D.hk.get(s.hracId+'|'+k);return e?e.body:(ef.includes(s)?s.body/2:s.body)};
  const hra=arr.filter(s=>vHre(u,k,s));
  const kap=ef.map(rawOf).sort((a,b)=>b-a);
  const bonus=sumA(kap);
  const vice=ef.some(s=>!s.kapitan);
  const opt=sumA(hra.map(rawOf).sort((a,b)=>b-a).slice(0,nomN));
  const lavka=arr.filter(s=>s.slot==='Bench');
  const lavBody=sumA(lavka.map(s=>{const e=D.hk.get(s.hracId+'|'+k);return e?e.body:s.body}));
  const raws=hra.map(rawOf),exp=raws.length?nomN*sumA(raws)/raws.length:0;
  const r={kapN:nomN,kapRaws:kap,vice,bonus,opt,exp,ztrata:Math.max(0,opt-bonus),lav,lavBody};
  D.an.set(key,r);
  return r;
}
function souhrnTym(u){
  const o={bonus:0,ztrata:0,trefa:0,kn:0,vice:0,lavNev:0,lavZisk:0,nejLav:null,nejZtr:null,kolBezLav:0,slotu:0,mrtva:0};
  for(const k of D.kola){
    if(!u.sestava.has(k))continue;
    const a=analyzaTK(u,k);
    if(!a.lav)for(const s of (u.sestava.get(k)||[])){
      if(s.slot==='Bench')continue;
      o.slotu++;const e=D.hk.get(s.hracId+'|'+k);if(!e||e.min===0)o.mrtva++;
    }
    if(a.kapN){
      o.kn++;if(a.vice)o.vice++;o.bonus+=a.bonus;o.ztrata+=a.ztrata;if(a.ztrata<1e-9)o.trefa++;
      if(a.ztrata>1e-9&&(!o.nejZtr||a.ztrata>o.nejZtr.z))o.nejZtr={k,z:a.ztrata};
    }
    if(a.lav)o.lavZisk+=a.lavBody;
    else{o.lavNev+=a.lavBody;o.kolBezLav++;if(a.lavBody>0&&(!o.nejLav||a.lavBody>o.nejLav.b))o.nejLav={k,b:a.lavBody}}
  }
  return o;
}

/* ======================================================================
   GRAFY – pořadí a rozptyl
   ====================================================================== */
function bumpChart(labels,rows,onClick){
  const N=rows.length,n=labels.length,W=1100,L=30,R=170,T=12,Bt=26,H=Math.max(190,N*17+T+Bt);
  const X=i=>L+(n<2?(W-L-R)/2:i*(W-L-R)/(n-1)),Y=r=>T+(N<2?0:(r-1)*(H-T-Bt)/(N-1));
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart bump',role:'img'});
  for(let r=1;r<=N;r++)svg.append(sv('line',{class:'gl',x1:L,x2:W-R,y1:Y(r),y2:Y(r)}),sv('text',{x:L-10,y:Y(r)+3.5,'text-anchor':'end'},String(r)));
  labels.forEach((l,i)=>svg.append(sv('text',{x:X(i),y:H-Bt+18,'text-anchor':'middle'},l)));
  for(const t of rows){
    if(!t.ranks.length)continue;
    const p=t.ranks.map((q,i)=>[X(i),Y(q.r)]),g=sv('g',{class:'tm'});
    if(p.length>1)g.append(sv('path',{class:'ln',d:krivka(p)}));
    p.forEach((q,i)=>g.append(sv('circle',{class:'pn',cx:q[0],cy:q[1],r:3}),
      sv('circle',{cx:q[0],cy:q[1],r:9,style:'fill:transparent'},sv('title',null,`Kolo ${labels[i]} · ${t.name}: ${t.ranks[i].r}. místo (${t.ranks[i].s} b)`))));
    const last=t.ranks[t.ranks.length-1],nm=t.name.length>22?t.name.slice(0,21)+'…':t.name;
    g.append(sv('text',{class:'nm',x:X(n-1)+10,y:Y(last.r)+3.5},nm));
    g.style.cursor='pointer';g.onclick=()=>onClick(t.id);
    svg.append(g);
  }
  return svg;
}

/* pts: [{x (0–100), y, r, name, hl, fn}] */
function scatter(pts,o){

function hraciStat(){
  if(D.hs)return D.hs;
  const vl=new Map(),pts=new Map(),pocetTymu=new Map();
  for(const u of D.tymy.values())for(const[k,arr]of u.sestava){
    pocetTymu.set(k,(pocetTymu.get(k)||0)+1);
    for(const s of arr){
      const key=s.hracId+'|'+k;
      if(!pts.has(key)){const e=D.hk.get(key);pts.set(key,{id:s.hracId,k,b:e?e.body:(jeKap(u,k,s)?s.body/2:s.body)})}
      if(vHre(u,k,s)){let o=vl.get(key);if(!o){o={n:0,teams:[]};vl.set(key,o)}o.n++;o.teams.push(u.jmeno+(jeKap(u,k,s)?' (K)':''))}
    }
  }
  for(const[key,e]of D.hk)if(!pts.has(key)&&e.zapasy.length)pts.set(key,{id:e.zapasy[0].hracId,k:e.zapasy[0].kolo,b:e.body});
  const map=new Map(),nk=D.kola.length||1;
  for(const{id,k,b}of pts.values()){
    let h=map.get(id);
    if(!h){h={id,h:D.hraci.get(id)||{},body:0,kola:0,min:0,goly:0,asist:0,zlute:0,cervene:0,vlSum:0,kolaList:[]};map.set(id,h)}
    const e=D.hk.get(id+'|'+k),o=vl.get(id+'|'+k),n=o?o.n:0,tot=pocetTymu.get(k)||0;
    h.body+=b;if(!e||e.min>0)h.kola++;
    if(e){h.min+=e.min;h.goly+=e.goly;h.asist+=e.asist;h.zlute+=e.zlute;h.cervene+=e.cervene}
    if(tot)h.vlSum+=n/tot;
    h.kolaList.push({k,b,e,n,tot,teams:o?o.teams:[]});
  }
  for(const h of map.values()){h.prumer=h.kola?h.body/h.kola:0;h.b90=h.min>0?h.body/h.min*90:null;h.vlast=h.vlSum/nk}
  let meni=false;
  if(D.maCeny){
    for(const h of map.values()){
      const m=D.ceny.get(h.id);if(!m||!m.size)continue;
      const sr=[...m].sort((a,b)=>a[0]-b[0]);
      h.cenaS=sr;h.cena=sr[sr.length-1][1];h.cena0=sr[0][1];
      h.zmena=sr.length>1?h.cena-h.cena0:null;
      if(sr.some(x=>x[1]!==sr[0][1]))meni=true;
    }
    const pom=[...map.values()].filter(h=>h.cena>0&&h.kola>=2).map(h=>h.prumer/h.cena);
    const med=percentil(pom,.5);
    for(const h of map.values())h.vyhod=med>0&&h.cena>0&&h.kola>=2?h.prumer/h.cena/med:null;
  }
  const p70=percentil([...map.values()].filter(h=>h.kola>0).map(h=>h.prumer),.7);
  for(const h of map.values())h.rozd=h.kola>=2&&h.vlast<.25&&h.prumer>0&&h.prumer>=p70;
  return D.hs={map,p70,meni};
}

function dumbbell(rows,o={}){
  const N=rows.length,W=900,L=130,R=24,T=10,Bt=26,RH=22,H=N*RH+T+Bt;

  const X=v=>L+(W-L-R)*(v-ax.lo)/(ax.hi-ax.lo),Y=i=>T+RH/2+i*RH;
  const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,class:'chart',role:'img'});
  for(const t of ax.ticks)svg.append(sv('line',{class:'gl',x1:X(t),x2:X(t),y1:T,y2:H-Bt}),sv('text',{x:X(t),y:H-Bt+16,'text-anchor':'middle'},o.real?f1(t):String(t)));
  rows.forEach((r,i)=>{
    const vs=r.pts.map(p=>p.v),nm=r.name.length>18?r.name.slice(0,17)+'…':r.name;
    svg.append(sv('text',{class:'dbn',x:L-10,y:Y(i)+3.5,'text-anchor':'end'},nm),
      sv('line',{class:'dbl',x1:X(Math.min(...vs)),x2:X(Math.max(...vs)),y1:Y(i),y2:Y(i)}));
    for(const p of r.pts)svg.append(sv('circle',{cx:X(p.v).toFixed(1),cy:Y(i),r:p.r||4.5,
      style:p.hollow?`fill:var(--card);stroke:${p.color};stroke-width:1.8`:`fill:${p.color}`},sv('title',null,`${r.name} · ${p.t}: ${fb(p.v)}`)));
  });
  return svg;
}
/* ---------- přestupy: kdo v kole přibyl a odešel oproti předchozímu kolu, penalizace a bilance bodů ---------- */
function rawPts(){
  if(D.raw)return D.raw;
  const m=new Map();
  for(const u of D.tymy.values())for(const[k,arr]of u.sestava)for(const s of arr){
    const key=s.hracId+'|'+k;if(m.has(key))continue;
    const e=D.hk.get(key);m.set(key,e?e.body:(jeKap(u,k,s)?s.body/2:s.body));
  }
  return D.raw=m;
}
function prestupyTK(u,k){
  D.pre=D.pre||new Map();
  const key=u.tymId+'|'+k;if(D.pre.has(key))return D.pre.get(key);
  let res=null;
  const i=D.kola.indexOf(k);let kp=i>0?D.kola[i-1]:null,vrat=false;
  const cur=u.sestava.get(k);let prev=kp!=null?u.sestava.get(kp):null;
  /* Bohatý majitel (financial_takeover) funguje jako Free Hit: pokud se sestava po něm vrátila na tu před ním, přestupy se počítají proti ní */
  if(prev&&i>1&&u.cipy.financial_takeover.kolo===kp){
    const kpp=D.kola[i-2],pp=u.sestava.get(kpp);
    if(pp&&pp.length&&cur&&cur.length){
      const sc=new Set(cur.map(x=>x.hracId)),shoda=a=>a.filter(x=>sc.has(x.hracId)).length;
      if(shoda(pp)>shoda(prev)){prev=pp;kp=kpp;vrat=true}
    }
  }
  if(cur&&prev&&cur.length&&prev.length){
    const ic=new Set(cur.map(x=>x.hracId)),ip=new Set(prev.map(x=>x.hracId)),RP=rawPts();
    const vstup=cur.filter(x=>!ip.has(x.hracId)).map(x=>({id:x.hracId,b:RP.get(x.hracId+'|'+k)}));
    const odchod=prev.filter(x=>!ic.has(x.hracId)).map(x=>{
      const kk=x.hracId+'|'+k,e=D.hk.get(kk);
      return{id:x.hracId,b:RP.has(kk)?RP.get(kk):(e?e.body:null)};
    });
    const n=vstup.length,cipTyp=u.cipy.wildcard.kolo===k?'wildcard':u.cipy.financial_takeover.kolo===k?'fp':null,wc=!!cipTyp;
    const ocek=wc?0:4*Math.max(0,n-1);
    const tk=u.kola.get(k);
    let pen=ocek,zdroj='pravidlo';
    if(tk&&tk.body!=null){
      const diff=(tk.lavicka?tk.soucetVse:tk.soucetSestavy)-tk.body;
      if(diff>=0&&diff%4===0){pen=diff;zdroj='oficiální body'}
    }
    const inB=sumA(vstup.map(x=>x.b)),nezn=odchod.filter(x=>x.b==null).length;
    const outB=nezn?null:sumA(odchod.map(x=>x.b));
    const delta=outB==null?null:inB-outB;
    const kd=D.kola.slice(i+1,i+4),bH=(id,kk)=>{const key=id+'|'+kk,e=D.hk.get(key);return e?e.body:(RP.has(key)?RP.get(key):null)};
    let vIn=0,vOut=0,nIn=0,nOut=0;
    for(const kk of kd){
      for(const x of vstup){const v=bH(x.id,kk);if(v==null)nIn++;else vIn+=v}
      for(const x of odchod){const v=bH(x.id,kk);if(v==null)nOut++;else vOut+=v}
    }
    const v3=kd.length?{kol:kd.length,inB:vIn,outB:vOut,nIn,nOut,delta:(nIn||nOut)?null:vIn-vOut}:null;
    const cisty=delta==null?null:delta-pen;
    res={k,n,wc,cipTyp,vrat,pen,ocek,zdroj,vstup,odchod,inB,outB,nezn,delta,cisty,v3,cisty4:v3&&v3.delta!=null&&cisty!=null?cisty+v3.delta:null};
  }
  D.pre.set(key,res);return res;
}
function agrPrest(rows){
  const o={n:0,pen:0,kolPen:0,delta:0,cisty:0,nezn:0,cisty4:0,nezn4:0,nej:null,nejh:null,kola:rows.length,kolaWc:rows.map(r=>r.k),kolaWcT:rows.map(r=>r.k+(r.cipTyp==='fp'?' (BM)':''))};
  for(const r of rows){
    o.n+=r.n;o.pen+=r.pen;if(r.pen>0)o.kolPen++;
    if(r.delta!=null){
      o.delta+=r.delta;o.cisty+=r.cisty;
      if(r.n>0){if(!o.nej||r.cisty>o.nej.cisty)o.nej=r;if(!o.nejh||r.cisty<o.nejh.cisty)o.nejh=r}
    }else if(r.n>0)o.nezn++;
    if(r.cisty4!=null)o.cisty4+=r.cisty4;else if(r.n>0&&r.v3)o.nezn4++;
  }
  return o;
}
/* Nevyužité přestupy zdarma se přenášejí do dalších kol (z dat vychází strop 4 a víc, počítá se s 5), čip jejich počet nemění.
   Počet zdarma na začátku dat neznáme, proto se u týmu vybere ten, se kterým nejlíp sedí oficiální penalizace. */
const STROP_VOLNYCH=5;
function modelVolnych(rows){
  const beh=start=>{
    let z=start,ok=0;const plat=new Map();
    for(const r of rows){
      const v=r.wc?0:Math.min(z,r.n),p=r.wc?0:4*(r.n-v);
      plat.set(r,p);
      if(r.zdroj==='oficiální body'){
        if(p===r.pen)ok++;
        /* oficiální penalizace je jistá: po zaplaceném přestupu je přenos vyčerpaný, jinak se spotřebovali viditelné přestupy.
           Přestupy uvnitř kola, které se v sestavách nepoznají (hráč přivedený a hned prodaný), tak nerozhodí model u dalších kol. */
        if(!r.wc)z=r.pen>0?1:Math.min(STROP_VOLNYCH,Math.max(z,r.n)-r.n+1);
      }else if(!r.wc)z=Math.min(STROP_VOLNYCH,z-v+1);
    }
    return{ok,plat};
  };
  let b=null;for(let st=1;st<=STROP_VOLNYCH;st++){const x=beh(st);if(!b||x.ok>b.ok)b=x}
  for(const r of rows){
    r.ocek=b.plat.get(r);
    if(r.zdroj==='pravidlo'){
      r.pen=r.ocek;
      r.cisty=r.delta==null?null:r.delta-r.pen;
      r.cisty4=r.v3&&r.v3.delta!=null&&r.cisty!=null?r.cisty+r.v3.delta:null;
    }
  }
}
function souhrnPrestupy(u){
  D.psu=D.psu||new Map();if(D.psu.has(u.tymId))return D.psu.get(u.tymId);
  const rows=D.kola.map(k=>prestupyTK(u,k)).filter(Boolean);
  modelVolnych(rows);
  const o=Object.assign({rows},agrPrest(rows));
  o.bez=agrPrest(rows.filter(r=>!r.wc));o.wc=agrPrest(rows.filter(r=>r.wc));
  D.psu.set(u.tymId,o);return o;
}
/* režim zobrazení přestupů: vse = dohromady, bez = bez čipů s neomezenými přestupy, odd = odděleně; přepínač se ukáže, jen když v lize nějaký Wildcard je */
const maWcPrest=()=>D.maWcP!=null?D.maWcP:(D.maWcP=[...D.tymy.values()].some(t=>souhrnPrestupy(t).wc.kola>0));

const jmB=x=>jm(x.id)+' ('+(x.b==null?'?':fb(x.b))+')';

function sekceSpravedlive(root,tymy){
  const rows=tymy.map(u=>{
    let lavZisk=0,bonus=0,exp=0,ztrata=0;
    for(const k of D.kola){
      if(!u.sestava.has(k))continue;
      const a=analyzaTK(u,k);
      if(a.lav)lavZisk+=a.lavBody;
      if(a.kapN){bonus+=a.bonus;exp+=a.exp;ztrata+=a.ztrata}
    }
    const skut=u.soucet,pen=souhrnPrestupy(u).pen;
    return{u,skut,pen,bezPen:skut+pen,bezLV:skut-lavZisk,lavZisk,prum:skut-bonus+exp,ideal:skut+ztrata,stesti:bonus-exp,bonus,ztrata};
  });
  const poradi=key=>{
    const l=[...rows].sort((a,b)=>b[key]-a[key]),m=new Map();let prev=null,pos=0;
    l.forEach((r,i)=>{if(r[key]!==prev){pos=i+1;prev=r[key]}m.set(r.u.tymId,pos)});return m;
  };
  const P={skut:poradi('skut'),bezLV:poradi('bezLV'),bezPen:poradi('bezPen'),prum:poradi('prum'),ideal:poradi('ideal')};
  const maPen=rows.some(r=>r.pen>0);
  for(const r of rows)for(const k of ['bezLV','bezPen','prum','ideal'])r['d_'+k]=P.skut.get(r.u.tymId)-P[k].get(r.u.tymId);
  const vitez=key=>rows.reduce((a,r)=>!a||r[key]>a[key]?r:a,null);
  const vi=vitez('ideal'),vp=vitez('prum'),vb=vitez('bezPen');
  const stMax=rows.reduce((a,r)=>!a||r.stesti>a.stesti?r:a,null),stMin=rows.reduce((a,r)=>!a||r.stesti<a.stesti?r:a,null);
  const serad=[...rows].sort((a,b)=>b.skut-a.skut||cs.compare(a.u.jmeno,b.u.jmeno));
  const prvni=rows.find(r=>P.skut.get(r.u.tymId)===1);
  root.append(el('h3','sl','Spravedlivé pořadí: kapitáni a čipy'),
    vysv('Vyhrává ten, kdo líp vybírá hráče, nebo ten, kdo má štěstí na kapitána? Kapitánovi se body počítají dvakrát, takže jeho volba umí zamíchat pořadím. Plná tečka = skutečný součet, bílý kroužek = kdyby kapitán dal body průměrného hráče sestavy, tyrkysový kroužek = kdyby byl kapitánem vždy nejlepší hráč sestavy. Šipky v tabulce ukazují, o kolik míst by se tým posunul. Sloupec „Bez penalizací“ přičte zpět body, které týmy zaplatily za přestupy navíc.',
      [vi.u===prvni.u?['I s ideálními kapitány by vedl ',B(vi.u.jmeno),', pořadí na špici by se nezměnilo.']:['Skutečně vede ',B(prvni.u.jmeno),', ale s ideálními kapitány by vedl ',B(vi.u.jmeno),'.'],
       maPen?[' Bez penalizací za přestupy by vedl ',B(vb.u.jmeno),' (',fb(vb.bezPen),' b).']:'',
       rows.length>1?[' Největší štěstí s kapitánem měl ',B(stMax.u.jmeno),' (',znam(stMax.stesti),' b), největší smůlu ',B(stMin.u.jmeno),' (',znam(stMin.stesti),' b).']:'']),
    bento(
    grafKarta('c8 r3','Kolik bodů by tým měl s jiným kapitánem',
      [['var(--text)','S průměrným kapitánem'],['var(--acc)','Skutečně'],['var(--k3)','S ideálním kapitánem']],
      dumbbell(serad.map(r=>({name:r.u.jmeno,pts:[
        {v:r.prum,color:'var(--text)',hollow:true,t:'průměrný kapitán'},
        {v:r.ideal,color:'var(--k3)',hollow:true,t:'ideální kapitán'},
        {v:r.skut,color:'var(--acc)',t:'skutečně',r:5}]})))),
    karta('c4','Vítěz s ideálním kapitánem',vi.u.jmeno,[[`${fb(vi.ideal)} b · skutečně ${P.skut.get(vi.u.tymId)}. místo`]]),
    karta('c4','Vítěz s průměrným kapitánem',vp.u.jmeno,[[`${fb(vp.prum)} b · skutečně ${P.skut.get(vp.u.tymId)}. místo`]]),
    karta('c4','Největší štěstí s kapitánem',znam(stMax.stesti),[[B(stMax.u.jmeno),' · nejhůř ',B(stMin.u.jmeno),' ',znam(stMin.stesti)]])));
  const bunkaD=(v,d)=>el('span','fair',el('span',null,fb(v)),
    d>0?el('span','zpos','▲'+d):d<0?el('span','zneg','▼'+(-d)):el('span','nic','–'));
  root.append(el('div','sekce',sortTb([
    {k:'poz',h:'#',c:'n tlum',f:r=>P.skut.get(r.u.tymId),v:r=>-P.skut.get(r.u.tymId)},
    {k:'jmeno',h:'Hráč',f:r=>B(r.u.jmeno),v:r=>r.u.jmeno},
    {k:'tym',h:'Tým',f:r=>el('span','tlum',r.u.nazevTymu),v:r=>r.u.nazevTymu},
    {k:'skut',h:'Skutečně',c:'n sum',f:r=>fb(r.skut),v:r=>r.skut,title:'Součet bodů za všechna kola'},
    {k:'bezLV',h:'Bez čipu Lavička',c:'n',f:r=>bunkaD(r.bezLV,r.d_bezLV),v:r=>r.bezLV,title:'Součet bez bodů lavičky započítaných čipem Hrdinové lavičky. ▲▼ = posun v pořadí oproti skutečnosti'},
    ...(maPen?[{k:'bezPen',h:'Bez penalizací',c:'n',f:r=>bunkaD(r.bezPen,r.d_bezPen),v:r=>r.bezPen,title:'Součet bodů s přičtenými penalizacemi za přestupy navíc (−4 b za každý přestup nad ty zdarma). ▲▼ = posun v pořadí oproti skutečnosti'}]:[]),
    {k:'prum',h:'S průměrným kapitánem',c:'n',f:r=>bunkaD(r.prum,r.d_prum),v:r=>r.prum,title:'Součet, kdyby kapitán získal body průměrného hráče sestavy. ▲▼ = posun v pořadí oproti skutečnosti'},
    {k:'ideal',h:'S ideálním kapitánem',c:'n',f:r=>bunkaD(r.ideal,r.d_ideal),v:r=>r.ideal,title:'Součet, kdyby byl kapitánem v každém kole nejlepší hráč sestavy. ▲▼ = posun v pořadí oproti skutečnosti'},
    {k:'stesti',h:'Štěstí s kapitánem',c:'n',f:r=>znam(r.stesti),v:r=>r.stesti,title:'Body navíc ze skutečných kapitánů minus body navíc, které by dal průměrný hráč sestavy. Plus = kapitáni dopadli lépe než průměr'},
    {k:'ztrata',h:'Ušlé body (kapitán)',c:'n',f:r=>r.ztrata?el('span','zneg','−'+fb(r.ztrata)):'0',v:r=>r.ztrata,title:'Kolik bodů tým přišel o tím, že kapitánem nebyl nejlepší hráč sestavy'}
  ],rows,UI.trF)));
}

const znN=x=>x==null?el('span','nic','?'):znam(x);
function sekcePrestupy(root,tymy){
  const rows=tymy.map(u=>Object.assign({u},souhrnPrestupy(u))).filter(r=>r.rows.length);
  if(!rows.length)return;
  const mode=modPrest(),odd=mode==='odd',A=r=>mode==='vse'?r:r.bez;
  const vse=rows.reduce((a,r)=>a+A(r).n,0),pen=rows.reduce((a,r)=>a+A(r).pen,0);
  const wcN=rows.reduce((a,r)=>a+r.wc.n,0),wcTym=rows.filter(r=>r.wc.kola>0).length;
  const nejP=rows.reduce((a,r)=>!a||A(r).pen>A(a).pen?r:a,null);
  const kandidati=rows.filter(r=>A(r).nej),nejK=kandidati.reduce((a,r)=>!a||A(r).nej.cisty>A(a).nej.cisty?r:a,null),nejS=kandidati.reduce((a,r)=>!a||A(r).nejh.cisty<A(a).nejh.cisty?r:a,null);
  const cistyMax=rows.filter(r=>A(r).n>0).reduce((a,r)=>!a||A(r).cisty>A(a).cisty?r:a,null);
  root.append(el('div','slr',el('h3','sl','Přestupy'),prepPrest()));
  root.append(vysv('Přestup je hráč, který v kole přibyl do kádru oproti předchozímu kolu. V každém kole je jeden přestup zdarma, nevyužité se přenášejí do dalších kol, každý další stojí −4 b (s čipem Přestavba kádru nebo Bohatý majitel se neplatí nic). „Rozdíl bodů“ je součet bodů přivedených hráčů minus součet bodů odvedených v kole přestupu. „Po penalizaci“ je ten rozdíl minus zaplacená penalizace: kladné číslo znamená, že se přestupy vyplatily. Počítají se body, které hráč v kole získal, ať už byl v základu, nebo na lavičce, a jen za kolo, kdy přestup proběhl.'
    +(maWcPrest()?' Kolo s čipem Přestavba kádru nebo Bohatý majitel (výměna kádru bez penalizace; Bohatý majitel funguje jako Free Hit a sestava se po něm může vrátit) jde započítat dohromady s ostatními, vynechat, nebo ukázat odděleně.':''),
      [nejP&&A(nejP).pen>0?['Nejvíc na penalizacích zaplatil ',B(nejP.u.jmeno),` (${A(nejP).pen} b v ${A(nejP).kolPen} kolech)`]:'Nikdo v lize nezaplatil žádnou penalizaci',
       cistyMax?[', nejlepší bilanci přestupů má ',B(cistyMax.u.jmeno),' (',znam(A(cistyMax).cisty),' b po penalizaci)']:'','.',
       nejK&&A(nejK).nej.cisty>0?[' Nejvýhodnější přestup kola udělal ',B(nejK.u.jmeno),` v kole ${A(nejK).nej.k} (`,znam(A(nejK).nej.cisty),' b).']:'',
       mode==='bez'&&wcN?` Kola s čipem Přestavba kádru nebo Bohatý majitel (${wcTym} týmů, ${wcN} přestupů) jsou vynechaná.`:'']));
  root.append(bento(
      karta('c3','Přestupů v lize',vse,[[mode==='vse'?`${rows.length} týmů`:`bez těchto čipů · ${rows.length} týmů`],...(odd&&wcN?[[`Čipy s neomezenými přestupy zvlášť: ${wcN} přestupů`]]:[])]),
      karta('c3','Zaplaceno na penalizacích',pen?'−'+pen:'0',[['b za přestupy nad ty zdarma']]),
      karta('c3','Nejvýhodnější přestup kola',nejK?znam(A(nejK).nej.cisty):'–',nejK?[[B(nejK.u.jmeno),` · kolo ${A(nejK).nej.k}`]]:[]),
      karta('c3','Nejhorší přestup kola',nejS?znam(A(nejS).nejh.cisty):'–',nejS?[[B(nejS.u.jmeno),` · kolo ${A(nejS).nejh.k}`]]:[])));
  const zakl=[
    {k:'jmeno',h:'Hráč',f:r=>B(r.u.jmeno),v:r=>r.u.jmeno},
    {k:'tym',h:'Tým',f:r=>el('span','tlum',r.u.nazevTymu),v:r=>r.u.nazevTymu},
    {k:'n',h:'Přestupů',c:'n',f:r=>A(r).n,v:r=>A(r).n},
    {k:'pen',h:'Penalizace',c:'n',f:r=>A(r).pen?el('span','zneg','−'+A(r).pen):el('span','nic','0'),v:r=>A(r).pen,title:'Body zaplacené za přestupy nad ty zdarma'},
    {k:'delta',h:'Rozdíl bodů',c:'n',f:r=>znam(A(r).delta),v:r=>A(r).delta,title:'Body přivedených hráčů minus body odvedených v kolech přestupů'},
    {k:'cisty',h:'Po penalizaci',c:'n',f:r=>el('b',null,znam(A(r).cisty)),v:r=>A(r).cisty,title:'Rozdíl bodů minus penalizace. Kladné = přestupy se vyplatily'},
    {k:'nej',h:'Nejlepší přestup',f:r=>A(r).nej&&A(r).nej.cisty>0?el('span','tlum',`kolo ${A(r).nej.k} · +${fb(A(r).nej.cisty)}`):'',v:r=>A(r).nej?A(r).nej.cisty:null},
    {k:'nejh',h:'Nejhorší přestup',f:r=>A(r).nejh&&A(r).nejh.cisty<0?el('span','tlum',`kolo ${A(r).nejh.k} · −${fb(-A(r).nejh.cisty)}`):'',v:r=>A(r).nejh?-A(r).nejh.cisty:null}];
  const wcCols=odd?[
    {k:'wk',h:'Čip (PK / BM) v kole',c:'n',f:r=>r.wc.kola?r.wc.kolaWcT.join(', '):el('span','nic','–'),v:r=>r.wc.kola?r.wc.kolaWc[0]:null},
    {k:'wn',h:'Čip: přestupů',c:'n',f:r=>r.wc.kola?r.wc.n:'',v:r=>r.wc.kola?r.wc.n:null},
    {k:'wd',h:'Čip: rozdíl bodů',c:'n',f:r=>r.wc.kola?znN(r.wc.nezn?null:r.wc.delta):'',v:r=>r.wc.kola&&!r.wc.nezn?r.wc.delta:null,title:'Body přivedených hráčů minus odvedených v kole s čipem Přestavba kádru nebo Bohatý majitel (penalizace žádná)'}]:[];
  root.append(el('div','sekce',sortTb([...zakl,...wcCols,
    {k:'cisty4',h:'S výhledem 3 kol',c:'n',f:r=>A(r).kola?znam(A(r).cisty4):'',v:r=>A(r).cisty4,title:'Součet „po penalizaci“ plus rozdíl bodů přivedených a odvedených hráčů v dalších třech kolech. Počítají se jen přestupy, u kterých body všech hráčů známe.'},
    {k:'nezn',h:'Neúplné',c:'n',f:r=>(A(r).nezn||A(r).nezn4)?el('span','nic',A(r).nezn+(A(r).nezn4?` (+${A(r).nezn4})`:'')):'',v:r=>A(r).nezn+A(r).nezn4,title:'Kol s přestupem, kde neznáme body odvedeného hráče (nikdo z ligy ho v tom kole neměl). V závorce navíc přestupy, kde chybí body ve výhledu'}
  ],rows,UI.trPr)));
}

function rozCtx(){
  const tymy=[...D.tymy.values()];
  return{tymy,nazvy:u=>B(u.jmeno),AT:k=>tymy.filter(u=>u.sestava.has(k)).map(u=>analyzaTK(u,k)),
    avg:a=>a.length?sumA(a)/a.length:0,rows:tymy.map(u=>Object.assign({u},souhrnTym(u)))};
}
function viewRozhodnuti(root){
  const tymy=[...D.tymy.values()];
  if(!tymy.length){root.append(el('div','tlum','Soubor neobsahuje žádné týmy.'));return}
  root.append(podnab('rozhodnuti',[['spravedlive','Spravedlivé pořadí'],['kapitani','Kapitáni'],['lavicka','Lavička'],['prestupy','Přestupy'],['cipy','Čipy']]));
  const c=rozCtx();
  ({spravedlive:()=>sekceSpravedlive(root,tymy),kapitani:()=>sekceKapitani(root,c),lavicka:()=>sekceLavicka(root,c),
    prestupy:()=>sekcePrestupy(root,tymy),cipy:()=>viewCipy(root)})[UI.sub.rozhodnuti]();
}

    {k:'ztrata',h:'Promarněno celkem',c:'n',f:r=>r.ztrata?el('span','zneg',fb(r.ztrata)):'0',v:r=>r.ztrata,title:'Součet bodů, o které tým přišel tím, že kapitánem nebyl nejlepší hráč sestavy'},
    {k:'zprum',h:'Promarněno na kolo',c:'n',f:r=>r.kn?f1(r.ztrata/r.kn):'',v:r=>r.kn?r.ztrata/r.kn:null},

  return{n:v.length,m,sd,cv:m?sd/m:0,min:Math.min(...v),max:Math.max(...v)};
}
function drzeniKola(k){

  const m=new Map();
  for(const u of D.tymy.values())for(const s of (u.sestava.get(k)||[]))if(vHre(u,k,s))m.set(s.hracId,(m.get(s.hracId)||0)+1);
  D.drz.set(k,m);return m;

function hracKola(k){

  }
  return best;
}

      if(!vHre(u,k,s))continue;

      for(const s of arr){

/* ======================================================================
   DATA – kontrola kvality souboru
   ====================================================================== */
function kontrolaData(){
  const out=[],add=(stav,nazev,vysl,det)=>out.push({stav,nazev,vysl,det:det||[]});
  const tymy=[...D.tymy.values()],m=D.meta||{},jmT=u=>u.jmeno;

  /* stažení */
  if(m.neuplne)add('chyba','Stahování dat',m.chyby&&m.chyby.length?`přerušeno, ${m.chyby.length} neúspěšných požadavků`:'přerušeno',(m.chyby||[]).slice(0,8));
  else if(m.chyby&&m.chyby.length)add('pozor','Stahování dat',`${m.chyby.length} neúspěšných požadavků`,m.chyby.slice(0,8));
  else add('ok','Stahování dat','bez chyb');

  /* chybějící kola */
  const chyb=tymy.map(u=>{
    const bezBodu=D.kola.filter(k=>!u.kola.has(k)||u.kola.get(k).body==null),bezSest=D.kola.filter(k=>!u.sestava.has(k));
    return{u,bezBodu,bezSest};
  }).filter(x=>x.bezBodu.length||x.bezSest.length);
  chyb.length?add('pozor','Úplnost kol',`${chyb.length} týmů má chybějící kolo`,chyb.map(x=>`${jmT(x.u)}: ${x.bezSest.length?'sestava chybí v kolech '+x.bezSest.join(', '):''}${x.bezSest.length&&x.bezBodu.length?'; ':''}${x.bezBodu.length?'body chybí v kolech '+x.bezBodu.join(', '):''}`).slice(0,8))
    :add('ok','Úplnost kol',`všech ${tymy.length} týmů má všech ${D.kola.length} kol`);

  /* součet sestavy a oficiální body */
  let sh=0,pen=0,nev=0,bezOf=0,celk=0,bezSouctu=0;const nevL=[];
  for(const u of tymy)for(const[k,t]of u.kola){
    if(t.soucetSestavy==null&&t.soucetVse==null){bezSouctu++;continue}
    if(t.sedi==null&&(t.poradi==null)){bezOf++;continue}
    celk++;
    const ls=t.lavicka?t.soucetVse:t.soucetSestavy;
    if(t.body===t.soucetSestavy||t.body===t.soucetVse)sh++;
    else{const d=ls-t.body;if(d>0&&d%4===0)pen++;else{nev++;const cn=CIPY.filter(c=>u.cipy[c[0]].kolo===k).map(c=>c[2]);nevL.push(`${jmT(u)}, kolo ${k}: sestava ${ls} b, oficiálně ${t.body} b (rozdíl ${d})${cn.length?', čip: '+cn.join(', '):', bez čipu'}`)}}
  }
  if(bezSouctu&&!celk)add('info','Součet sestavy a body kola','soubor neobsahuje součty sestav');
  else add(nev?'pozor':'ok','Součet sestavy a body kola',`${sh} z ${celk} kol sedí přesně, ${pen} se liší o násobek 4 b (penalizace za přestupy)${nev?`, ${nev} nevysvětleno`:''}`,nevL.slice(0,12));
  if(bezOf)add('info','Oficiální body kola',`u ${bezOf} týmů a kol chybí oficiální body, počítá se součet sestavy`);

  /* kádry */
  const velk=new Map();for(const u of tymy)for(const[k,a]of u.sestava)velk.set(a.length,(velk.get(a.length)||0)+1);
  const mod=[...velk].sort((a,b)=>b[1]-a[1])[0];
  if(mod){
    const odl=[];for(const u of tymy)for(const[k,a]of u.sestava)if(a.length!==mod[0])odl.push(`${jmT(u)}, kolo ${k}: ${a.length} hráčů`);
    odl.length?add('pozor','Velikost kádru',`obvykle ${mod[0]} hráčů, ${odl.length} sestav se liší`,odl.slice(0,8)):add('ok','Velikost kádru',`všechny sestavy mají ${mod[0]} hráčů`);
  }

  /* zápasy hráčů */
  if(!D.hk.size)add('pozor','Zápasy hráčů','soubor neobsahuje řádky hráč × zápas, chybí minuty, góly a karty');
  else{
    let mist=0,bez=0;
    for(const u of tymy)for(const[k,a]of u.sestava)for(const x of a){if(x.slot==='Bench')continue;mist++;if(!D.hk.has(x.hracId+'|'+k))bez++}
    add('info','Zápasy hráčů',`${D.hk.size} záznamů hráč × kolo; ${bez} z ${mist} míst v základu je bez zápasu v daném kole (hráč neměl zápas)`);
  }

  /* kapitáni */
  let bezK=0,dva=0,prevz=0;const dvaL=[];
  for(const u of tymy)for(const[k,a]of u.sestava){
    const nom=a.filter(x=>x.kapitan).length;
    if(!nom)bezK++;
    if(nom>=2&&!u.cipy.two_captains.odhad&&u.cipy.two_captains.kolo!==k){dva++;dvaL.push(`${jmT(u)}, kolo ${k}`)}
    if(kapEf(u,k).some(x=>!x.kapitan))prevz++;
  }
  add(bezK||dva?'pozor':'ok','Kapitáni',bezK?`${bezK} sestav bez kapitána`:dva?`${dva} sestav se dvěma kapitány bez čipu`:'každá sestava má kapitána',dvaL.slice(0,8));
  add('info','Zástupce kapitána',`v ${prevz} sestavách převzal zdvojení zástupce, protože kapitán nenastoupil`);

  /* čipy */
  const bezC=tymy.filter(u=>u.cipy.wildcard.bezDat);
  bezC.length?add('pozor','Čipy',`u ${bezC.length} týmů nejsou čipy ze serveru, Hrdinové lavičky a Super duo jsou jen odhad`,bezC.map(jmT).slice(0,8)):add('ok','Čipy','čipy jsou načtené ze serveru u všech týmů');

  /* přestupy */
  const pr=tymy.flatMap(u=>souhrnPrestupy(u).rows.filter(r=>r.n>0));
  if(pr.length){
    const nezn=pr.filter(r=>r.nezn>0),roz=pr.filter(r=>r.pen!==r.ocek),nizsi=roz.filter(r=>r.pen<r.ocek).length;
    add(nezn.length?'info':'ok','Přestupy: body odvedených hráčů',nezn.length?`u ${nezn.length} z ${pr.length} kol s přestupem neznáme body odvedeného hráče (nikdo z ligy ho v kole neměl), bilance tam není úplná`:'body odvedených hráčů známe vždy');
    add(roz.length?'pozor':'ok','Přestupy: penalizace podle pravidla',roz.length?`${roz.length} z ${pr.length} kol se liší od pravidla „přestupy zdarma se přenášejí, každý další −4 b“ (oficiálně nižší penalizace v ${nizsi}, vyšší v ${roz.length-nizsi})`:'penalizace odpovídají pravidlu v ${pr.length} kolech'.replace('${pr.length}',pr.length),
      roz.map(r=>{const u=tymy.find(t=>souhrnPrestupy(t).rows.includes(r));return `${u?jmT(u):'?'}, kolo ${r.k}: ${r.n} přestupů, pravidlo ${r.ocek} b, oficiálně ${r.pen} b${r.cipTyp?' ('+(r.cipTyp==='fp'?'Bohatý majitel':'Přestavba kádru')+')':''}`}).slice(0,14));
    /* zkouška, jestli se nevyužité přestupy zdarma nepřenášejí do dalšího kola (strop 1 = pravidlo „1 za kolo“);
       počet zdarma na začátku dat neznáme, proto se u každého týmu zkusí všechny možnosti a vybere nejlepší */
    const simTym=(u,strop,zadrz,start)=>{
      let zdarma=start,ok=0,celk=0;const spatne=[];
      for(const r of souhrnPrestupy(u).rows){
        if(r.zdroj!=='oficiální body')continue;
        const vyuz=r.wc?0:Math.min(zdarma,r.n),plat=r.wc?0:4*(r.n-vyuz);
        celk++;if(plat===r.pen)ok++;else spatne.push(`${jmT(u)}, kolo ${r.k}: ${r.n} přestupů, oficiálně ${r.pen} b, model ${plat} b`);
        zdarma=(r.wc&&zadrz)?zdarma:r.wc?Math.min(strop,zdarma+1):r.pen>0?1:Math.min(strop,Math.max(zdarma,r.n)-r.n+1);
      }
      return{ok,celk,spatne,start};
    };
    const sim=(strop,zadrz)=>{
      let ok=0,celk=0;const spatne=[];
      for(const u of tymy){
        let b=null;for(let st=1;st<=Math.min(strop,6);st++){const x=simTym(u,strop,zadrz,st);if(!b||x.ok>b.ok)b=x}
        ok+=b.ok;celk+=b.celk;spatne.push(...b.spatne);
      }
      return{strop,zadrz,ok,celk,spatne};
    };
    const hyp=[1,2,3,4,5,99].map(st=>{const a=sim(st,false),b=sim(st,true);return b.ok>a.ok?b:a}),best=hyp.reduce((a,x)=>x.ok>a.ok?x:a,hyp[0]);
    const nazS=h=>h.strop===99?'bez stropu':'strop '+h.strop;

      +(best.spatne.length?'. Nesedí: '+best.spatne.slice(0,8).join(' · '):''));
    const fpU=tymy.filter(u=>u.cipy.financial_takeover.kolo!=null);
    if(fpU.length){
      const vr=fpU.filter(u=>souhrnPrestupy(u).rows.some(r=>r.vrat));
      add('info','Bohatý majitel (jako Free Hit)',`použilo ${fpU.length} týmů, u ${vr.length} se sestava po něm vrátila na tu před ním (přestupy se pak počítají proti ní)`,fpU.map(u=>`${jmT(u)}: kolo ${u.cipy.financial_takeover.kolo}${souhrnPrestupy(u).rows.some(r=>r.vrat)?', sestava se vrátila':', sestava se nevrátila'}`).slice(0,12));
    }
  }else add('info','Přestupy','v datech nejsou žádné přestupy');

  /* ceny */
  if(D.maCeny){
    let meni=false;for(const mm of D.ceny.values()){const v=[...mm.values()];if(v.some(x=>x!==v[0])){meni=true;break}}
    add(meni?'ok':'info','Ceny hráčů',meni?`ceny u ${D.ceny.size} hráčů, v kolech se mění`:`ceny u ${D.ceny.size} hráčů, ale v kolech se neliší, jde o jednu (aktuální) cenu`);
  }else add('info','Ceny hráčů','soubor ceny neobsahuje');

  /* hráči */
  const bezP=[...D.hraci.values()].filter(h=>!h.pozice||h.klubId==null);
  add(bezP.length?'pozor':'ok','Hráči: pozice a klub',bezP.length?`${bezP.length} hráčů bez pozice nebo klubu`:`${D.hraci.size} hráčů, všichni mají pozici i klub`,bezP.map(h=>`${h.jmeno||''} ${h.prijmeni||''}`.trim()||('#'+h.id)).slice(0,8));

  /* součet kol vs. body ligy */
  const rozdil=tymy.filter(u=>typeof u.body==='number'&&u.body!==u.soucet);
  tymy.some(u=>typeof u.body==='number')?add(rozdil.length?'pozor':'ok','Součet kol a body v tabulce ligy',rozdil.length?`${rozdil.length} týmů má jiný součet kol, než uvádí liga`:'součty kol sedí s tabulkou ligy u všech týmů',
    rozdil.map(u=>`${jmT(u)}: součet kol ${u.soucet} b, liga ${u.body} b`).slice(0,8)):add('info','Součet kol a body v tabulce ligy','soubor neobsahuje body z tabulky ligy');
  return out;
}
function viewData(root){
  const K=kontrolaData(),m=D.meta||{};
  const poc=s=>K.filter(x=>x.stav===s).length;
  root.append(vysv('Jak moc se dá souboru věřit: kontroly úplnosti a souhlasu čísel. Zelená tečka je v pořádku, žlutá upozornění, červená chyba, prázdný kroužek jen informace.',
    [`Z ${K.length} kontrol je v pořádku ${poc('ok')}, upozornění ${poc('pozor')}`,poc('chyba')?`, chyb ${poc('chyba')}`:'',`, ${poc('info')} jen informativních.`]));
  const nRadku=[...D.hk.values()].reduce((a,e)=>a+e.zapasy.length,0);
  root.append(bento(
    karta('c3','Týmů · kol',`${D.tymy.size} · ${D.kola.length}`,[[m.sezona?`sezóna ${m.sezona}`:'']]),
    karta('c3','Hráčů v datech',D.hraci.size,[[`${nRadku} zápasů hráčů`]]),
    karta('c3','Staženo',m.vytvoreno?new Date(m.vytvoreno).toLocaleDateString('cs-CZ'):'–',[[m.vytvoreno?new Date(m.vytvoreno).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}):'']]),
    karta('c3','Verze extraktoru',m.verze!=null?m.verze:'–',[[m.liga&&m.liga.nazev?m.liga.nazev:'']])));
  const bar={ok:'var(--acc)',pozor:'var(--amber)',chyba:'var(--rose)',info:null};
  root.append(el('div','sekce',tb([
    {h:'',c:'dotc',f:r=>dot(bar[r.stav],!bar[r.stav])},
    {h:'Kontrola',f:r=>B(r.nazev)},
    {h:'Výsledek',f:r=>r.vysl},
    {h:'Podrobnosti',f:r=>{if(!r.det.length)return '';const e=el('span','tlum',r.det.join(' · '));e.style.cssText='white-space:normal;display:block;min-width:260px';return e}}
  ],K)));
}

/* ---------- vykreslení a načtení ---------- */
function kresliVse(){
  $('#zalozky').replaceChildren(...ZALOZKY.map(([k,t])=>{
    const b=el('button',k===UI.zalozka?'aktivni':'',t);b.onclick=()=>{UI.zalozka=k;kresliVse()};return b;
  }));
  const root=$('#obsah');root.replaceChildren();
  ({prehled:viewPrehled,poradi:viewPoradi,tym:viewTym,kolo:viewKolo,hraci:viewHraci,souboj:viewSouboj,rozhodnuti:viewRozhodnuti,data:viewData})[UI.zalozka](root);
}
async function nacti(f){
  const ch=$('#chyba');ch.textContent='';
  try{
    let raw;
    try{raw=JSON.parse(await f.text())}catch{throw new Error('Soubor není platný JSON.')}
    D=pripravit(raw);
  }catch(e){ch.textContent=e.message;return}
  UI.tym=null;UI.kolo=null;UI.hrac=null;UI.souA=null;UI.souB=null;UI.souKolo='all';
  $('#prazdny').hidden=true;$('#app').hidden=false;
  const m=D.meta||{};
  $('#znacka').textContent='Fantasy · '+(m.liga&&m.liga.nazev?m.liga.nazev:'liga');
  $('#soubor').textContent=[f.name,`${D.tymy.size} týmů`,D.kola.length?`kola ${D.kola[0]}–${D.kola[D.kola.length-1]}`:'',
    m.vytvoreno?`staženo ${new Date(m.vytvoreno).toLocaleString('cs-CZ')}`:''].filter(Boolean).join(' · ');
  kresliVse();
}
/* vzhled: hustota tabulek a kontrastní režim (pamatuje se v prohlížeči, pokud to jde) */
const VZ={hust:false,kon:false};
try{const x=JSON.parse(localStorage.getItem('liga-vzhled')||'{}');VZ.hust=!!x.hust;VZ.kon=!!x.kon}catch{}
function vzhled(uloz){
  const r=document.documentElement;
  if(VZ.hust)r.setAttribute('data-hustota','kompakt');else r.removeAttribute('data-hustota');
  if(VZ.kon)r.setAttribute('data-kontrast','1');else r.removeAttribute('data-kontrast');
  $('#bHust').setAttribute('aria-pressed',String(VZ.hust));$('#bKon').setAttribute('aria-pressed',String(VZ.kon));
  if(uloz){try{localStorage.setItem('liga-vzhled',JSON.stringify(VZ))}catch{}}
}
$('#bHust').onclick=()=>{VZ.hust=!VZ.hust;vzhled(true)};
$('#bKon').onclick=()=>{VZ.kon=!VZ.kon;vzhled(true)};
vzhled(false);
$('#nahrat').onclick=()=>$('#vstup').click();
$('#jiny').onclick=()=>$('#vstup').click();
$('#vstup').onchange=e=>{const f=e.target.files[0];if(f)nacti(f);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('pretahnout')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('pretahnout')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('pretahnout');const f=e.dataTransfer.files[0];if(f)nacti(f)});
})();
</script>
