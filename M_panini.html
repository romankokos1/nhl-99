<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HC Motor — Balíček kartiček</title>
<style>
:root{
  --blue:#1b4b9e; --blue-d:#10306e; --gold:#f4c14b; --ink:#12151c;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(circle at 50% 0%, #1d2a52 0%, #0b1023 60%);
  color:#fff; min-height:100vh; overflow-x:hidden;
}
header{text-align:center; padding:24px 16px 8px;}
header h1{font-size:22px; text-transform:uppercase; letter-spacing:1px; font-weight:800;}
header h1 span{color:var(--gold);}
header p{font-size:13px; color:#9fb0d8; margin-top:4px;}

.stage{max-width:1000px; margin:0 auto; padding:16px;}

/* pack */
.pack-wrap{display:flex; flex-direction:column; align-items:center; gap:20px; padding:24px 0 40px;}
.pack{
  width:230px; height:330px; cursor:pointer; position:relative;
  border-radius:16px; transition:transform .25s, box-shadow .25s;
  background:linear-gradient(160deg,var(--blue) 0%, var(--blue-d) 100%);
  box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 2px 6px rgba(255,255,255,.15);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:2px solid rgba(255,255,255,.18); overflow:hidden;
}
.pack::before{
  content:""; position:absolute; top:0; left:-60%; width:50%; height:100%;
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg); animation:shine 3.5s infinite;
}
@keyframes shine{0%{left:-60%;}40%{left:130%;}100%{left:130%;}}
.pack:hover{transform:translateY(-6px) scale(1.02); box-shadow:0 24px 50px rgba(0,0,0,.6);}
.pack .logo{font-size:46px; font-weight:900; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.4);}
.pack .lbl{margin-top:8px; font-size:13px; letter-spacing:3px; color:var(--gold); font-weight:700;}
.pack .sub{position:absolute; bottom:18px; font-size:11px; color:#cdd9f5; letter-spacing:1px;}
.pack.opening{animation:tear .6s forwards;}
@keyframes tear{50%{transform:scale(1.08) rotate(-2deg);}100%{transform:scale(.2); opacity:0;}}

.hint{font-size:13px; color:#9fb0d8;}

/* reveal grid */
.cards{
  display:grid; grid-template-columns:repeat(5,1fr); gap:14px;
  perspective:1200px; padding:10px 0 30px;
}
@media(max-width:860px){.cards{grid-template-columns:repeat(3,1fr);}}
@media(max-width:520px){.cards{grid-template-columns:repeat(2,1fr);}}

.card{
  aspect-ratio:2/3; position:relative; transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.2,.8,.3,1); cursor:pointer;
  opacity:0; transform:translateY(20px);
}
.card.in{opacity:1; transform:translateY(0);}
.card.flipped .inner{transform:rotateY(180deg);}
.inner{position:absolute; inset:0; transform-style:preserve-3d; transition:transform .6s;}
.face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
  overflow:hidden; display:flex; flex-direction:column;
}
.back{
  background:linear-gradient(160deg,var(--blue),var(--blue-d));
  border:2px solid rgba(255,255,255,.2); align-items:center; justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.back .q{font-size:40px; font-weight:900; color:rgba(255,255,255,.85);}
.back .bsub{font-size:9px; letter-spacing:2px; color:var(--gold); margin-top:6px;}
.front{
  transform:rotateY(180deg); background:#0f1426;
  border:2px solid var(--tier,#888);
}
.front .photo{
  flex:1; background:#1a2138 no-repeat center top; background-size:cover;
}
.front .bar{
  background:var(--tier,#888); color:#000; font-size:9px; font-weight:800;
  text-align:center; padding:2px; letter-spacing:1px; text-transform:uppercase;
}
.front .nm{font-size:12px; font-weight:800; padding:5px 6px 2px; line-height:1.15;}
.front .ct{font-size:10px; color:#9fb0d8; padding:0 6px;}
.front .se{font-size:9px; color:var(--tier,#aaa); padding:3px 6px 6px; font-weight:700; margin-top:auto;}
.card.tier-legend .front{box-shadow:0 0 22px var(--gold), inset 0 0 18px rgba(244,193,75,.25);}
.card.tier-legend .front::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(130deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);
  animation:shine 2.5s infinite;
}

.controls{text-align:center; padding:10px 0 50px;}
.btn{
  background:var(--gold); color:#10306e; border:none; font-weight:800;
  padding:13px 26px; border-radius:30px; font-size:15px; cursor:pointer;
  letter-spacing:.5px; box-shadow:0 8px 20px rgba(0,0,0,.3); transition:transform .15s;
}
.btn:hover{transform:translateY(-2px);}
.btn.ghost{background:transparent; color:#fff; border:2px solid rgba(255,255,255,.3); margin-left:10px;}

.tiers-legend{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; font-size:10px; padding:0 0 20px; color:#9fb0d8;}
.tiers-legend b{display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; margin-right:3px;}
.hidden{display:none;}
.tap{font-size:11px; color:#7e8fc0; text-align:center; padding-bottom:8px;}
</style>
</head>
<body>
<header>
  <h1>HC <span>Motor</span> — Balíček kartiček</h1>
  <p>Otevři balíček a sbírej hráče z historie klubu</p>
</header>

<div class="stage">
  <div id="packView" class="pack-wrap">
    <div class="pack" id="pack">
      <div class="logo">M</div>
      <div class="lbl">MOTOR</div>
      <div class="sub">5 KARET · KLIKNI</div>
    </div>
    <div class="hint">Klikni na balíček a roztrhni ho 📦</div>
    <div class="tiers-legend">
      <span><b style="background:#f4c14b"></b>Legenda 15+</span>
      <span><b style="background:#b06bff"></b>Epická 10–14</span>
      <span><b style="background:#4aa3ff"></b>Vzácná 5–9</span>
      <span><b style="background:#3ec98a"></b>Neobyčejná 2–4</span>
      <span><b style="background:#9aa6bf"></b>Běžná 1</span>
    </div>
  </div>

  <div id="revealView" class="hidden">
    <div class="tap">Klikni na kartu a otoč ji · nebo otoč všechny</div>
    <div class="cards" id="cards"></div>
    <div class="controls">
      <button class="btn" id="flipAll">Otoč všechny</button>
      <button class="btn ghost" id="again">Nový balíček</button>
    </div>
  </div>
</div>

function tier(s){
  if(s>=15) return {k:'legend', c:'#f4c14b', n:'Legenda'};
  if(s>=10) return {k:'epic',   c:'#b06bff', n:'Epická'};
  if(s>=5)  return {k:'rare',   c:'#4aa3ff', n:'Vzácná'};
  if(s>=2)  return {k:'uncommon',c:'#3ec98a',n:'Neobyčejná'};
  return {k:'common', c:'#9aa6bf', n:'Běžná'};
}

// weighted pick: rarer players slightly less likely, but guarantee variety
function drawPack(){
  const pool=[...PLAYERS];
  const pick=[];
  for(let i=0;i<5;i++){
    // weight: lower seasons more common
    const idx=Math.floor(Math.random()*pool.length);
    pick.push(pool.splice(idx,1)[0]);
  }
  // ensure roughly sorted so a rare one tends to be last (nice reveal)
  pick.sort((a,b)=>(a.s||0)-(b.s||0));
  return pick;
}

const pack=document.getElementById('pack');
const packView=document.getElementById('packView');
const revealView=document.getElementById('revealView');
const cardsEl=document.getElementById('cards');

function openPack(){
  pack.classList.add('opening');
  setTimeout(()=>{
    packView.classList.add('hidden');
    revealView.classList.remove('hidden');
    renderCards(drawPack());
    pack.classList.remove('opening');
  },600);
}
pack.addEventListener('click', openPack);

function renderCards(cards){
  cardsEl.innerHTML='';
  cards.forEach((p,i)=>{
    const t=tier(p.s||0);
    const bg=p.pz? (p.pz*100).toFixed(0)+'% auto':'cover';
    const pos=p.pp||'center top';
    const life='* '+(p.b||'') + (p.d? '  † '+p.d : '');
    const el=document.createElement('div');
    el.className='card tier-'+t.k;
    el.style.setProperty('--tier', t.c);
    el.innerHTML=`
      <div class="inner">
        <div class="face back"><div class="q">?</div><div class="bsub">MOTOR</div></div>
        <div class="face front">
          <div class="bar">${t.n}</div>
          <div class="photo" style="background-image:url('${p.p}');background-position:${pos};background-size:${bg};"></div>
          <div class="nm">${p.n}</div>
          <div class="ct">${p.c||''}</div>
          <div class="se">${p.s}× sezóna · ${p.sr||''}</div>
        </div>
      </div>`;
    el.addEventListener('click',()=>el.classList.toggle('flipped'));
    cardsEl.appendChild(el);
    setTimeout(()=>el.classList.add('in'), 90*i);
  });
}

document.getElementById('flipAll').addEventListener('click',()=>{
  const cs=[...cardsEl.querySelectorAll('.card')];
  const anyUnflipped=cs.some(c=>!c.classList.contains('flipped'));
  cs.forEach((c,i)=>setTimeout(()=>c.classList.toggle('flipped',anyUnflipped),70*i));
});
document.getElementById('again').addEventListener('click',()=>{
  revealView.classList.add('hidden');
  packView.classList.remove('hidden');
});
